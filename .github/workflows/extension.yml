name: Browser extension

# extension-* tags build production. Run it by hand to build any branch with
# either profile. Values come from extension/release-config.json and
# extension/prerelease-config.json.
on:
    push:
        tags: ["extension-*"]
    workflow_dispatch:
        inputs:
            profile:
                description: Configuration to build
                type: choice
                options: [preprod, production]
                default: preprod

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.profile || 'production' }}
    cancel-in-progress: false

jobs:
    e2e:
        name: Extension end-to-end
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.16.0
            - name: Enable pnpm
              run: corepack enable && corepack prepare pnpm@11.25.0 --activate
            - name: Install frozen lockfile
              run: pnpm install --frozen-lockfile
            - name: Install Chromium
              run: pnpm exec playwright install --with-deps chromium
            - name: Run extension end-to-end tests
              run: pnpm test:e2e:extension
            - name: Upload extension end-to-end artifacts
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: extension-e2e
                  path: test-results/e2e
                  if-no-files-found: ignore

    package:
        name: Chromium extension package
        needs: e2e
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'production' }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.16.0
            - name: Enable pnpm
              run: corepack enable && corepack prepare pnpm@11.25.0 --activate
            - name: Install frozen lockfile
              run: pnpm install --frozen-lockfile
            - name: Lint extension
              run: pnpm lint:ext
            - name: Type-check extension
              run: pnpm --filter extension lint-tsc
            - name: Check release configurations
              run: |
                  node --test extension/scripts/release-config.test.mjs
                  pnpm exec jest extension/tests/production-env.test.ts --runInBand
            - name: Build extension
              run: pnpm build:ext -- --profile "$PROFILE"
            - name: Create extension ZIP
              id: package
              working-directory: extension/dist
              shell: bash
              run: |
                  test -f manifest.json
                  if find . -name '*.map' -print -quit | grep -q .; then
                    echo "Release extension must not contain source maps" >&2
                    exit 1
                  fi
                  if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
                    label="${GITHUB_REF_NAME}"
                  else
                    label="${PROFILE}-${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
                  fi
                  name="cryptex-vault-chromium-${label//[^a-zA-Z0-9._-]/-}"
                  archive="${RUNNER_TEMP}/${name}.zip"
                  zip -X -q -r "$archive" .
                  unzip -tq "$archive"
                  echo "path=${archive}" >> "$GITHUB_OUTPUT"
            # archive: false keeps GitHub from wrapping the ZIP in another ZIP. The
            # artifact is named after the file.
            - name: Upload extension ZIP
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  path: ${{ steps.package.outputs.path }}
                  archive: false
                  if-no-files-found: error
                  retention-days: 30

    # extension-v1.2.3 tags open a draft GitHub release with the 1.2.3 section
    # of extension/CHANGELOG.md and the ZIP. Publishing it is a manual step.
    draft-release:
        name: Draft GitHub release
        needs: [package]
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/extension-v')
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  sparse-checkout: |
                      extension/CHANGELOG.md
                      scripts/draft-release.sh
                  sparse-checkout-cone-mode: false
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: cryptex-vault-chromium-*
                  merge-multiple: true
                  path: dist
            - name: Create draft release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_OUTRO: The Chrome Web Store update follows after review.
              shell: bash
              run: scripts/draft-release.sh "Extension v${GITHUB_REF_NAME#extension-v}" extension/CHANGELOG.md dist/*.zip
