appId: ${CRYPTEX_APP_ID}
name: Chrome login review, cancellation, unlock, and code handoff
---
- launchApp: com.android.chrome
- openLink: http://localhost:43110/fresh-login?case=cancel
- runFlow: autofill-browser-dismiss-tips.yaml
- assertVisible: Deterministic login fixture
- assertVisible: Login fields empty
- tapOn: Username.*
- assertVisible: .*${CRYPTEX_APP_NAME}
- tapOn: .*${CRYPTEX_APP_NAME}
- runFlow: autofill-browser-unlock-if-needed.yaml
- assertVisible: Android could not confirm.*browser page and login field.*
- tapOn: Fixture Login, fixture@example.test.*
- assertVisible: Review destination
- tapOn: Cancel
- assertVisible: Choose a login
- tapOn: Cancel autofill
- runFlow:
      when:
          visible: Chrome
      commands:
          - tapOn: Chrome
# Chrome can drop the page from accessibility after Autofill returns, so submit
# from the still-focused Username field. The server distinguishes both fields
# empty from a partial or filled form.
- pressKey: Enter
# Chrome 155 adds the connection security label after the address.
- assertVisible: localhost:43110/login/otp\?accepted=0&empty=1.*

# A matching login still needs a separate destination review on this browser.
- openLink: http://localhost:43110/fresh-login?case=fill
- runFlow: autofill-browser-dismiss-tips.yaml
- tapOn: Username.*
- tapOn: .*${CRYPTEX_APP_NAME}
- runFlow: autofill-browser-unlock-if-needed.yaml
- assertVisible: Android could not confirm.*browser page and login field.*
- tapOn: Fixture Login, fixture@example.test.*
- assertVisible: Review destination
- tapOn: Fill once
- runFlow:
      when:
          visible: Chrome
      commands:
          - tapOn: Chrome
# The fixture checks the actual posted fields.
- pressKey: Enter
- assertVisible: localhost:43110/login/otp\?accepted=1&empty=0.*

# Autofill copied the selected login's current verification code. Chrome's
# Paste menu often closes before Maestro finds it, so read the clipboard in the
# test app and type the code into the page.
- launchApp: com.cryptex.autofillfixture
- tapOn: Clipboard code
- tapOn: Show clipboard
- copyTextFrom: "[0-9]{6}"
- openLink: http://localhost:43110/login/otp?accepted=1
- tapOn:
      rightOf: Verification code.*
      leftOf: Verify
- inputText: ${maestro.copiedText}
- pressKey: Enter
- assertVisible: localhost:43110/otp\?accepted=1.*
