appId: ${CRYPTEX_APP_ID}
name: Android credential features
---
- runFlow: setup-vault.yaml
- tapOn: Add item
- tapOn:
      id: add-item-login
- tapOn: Credential name
- inputText: Fixture Login
- tapOn: Credential username
- inputText: fixture@example.test
- tapOn:
      id: credential-password
- inputText: fixture-password
- runFlow: hide-keyboard.yaml
- tapOn:
      id: credential-website-url
- eraseText
- inputText: http://localhost:43110/login
- assertVisible: http://localhost:43110/login
- runFlow: hide-keyboard.yaml
- scrollUntilVisible:
      element:
          text: Add website
      direction: DOWN
- tapOn: Add website
- tapOn:
      id: credential-website-url-2
- eraseText
- inputText: https://accounts.example.test
- assertVisible: https://accounts.example.test
- runFlow: hide-keyboard.yaml
- scrollUntilVisible:
      element:
          id: credential-submit
      direction: DOWN
- tapOn:
      id: credential-submit
- assertVisible: Fixture Login.*
- tapOn: Back
- tapOn: More
- tapOn: Autofill.*
- assertVisible: Password autofill.*
- tapOn: Suggestion display.*
- assertVisible: Above keyboard.*
- assertVisible: Popup / dropdown.*
- runFlow: go-back.yaml
- assertVisible: Browser integrations.*
- scrollUntilVisible:
      element:
          text: Copy verification codes after autofill
      direction: DOWN
- assertVisible: Copy verification codes after autofill
