appId: ${CRYPTEX_APP_ID}
name: Edit the credential on the receiving device
---
- tapOn: E2E Updated After Link.*
- tapOn: Edit item
- tapOn: Credential username
- eraseText: 100
- inputText: returned@example.test
- tapOn:
    text: Password, Hidden.*
- eraseText: 100
- inputText: receiver-updated-password-43
- hideKeyboard
- scrollUntilVisible:
    element:
      id: credential-submit
    direction: DOWN
- tapOn:
    id: credential-submit
- assertVisible: returned@example.test
- runFlow:
    file: sync-device-now.yaml
    env:
      PEER_NAME: Root Device
