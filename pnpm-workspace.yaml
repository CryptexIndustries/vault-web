packages:
  - web
  - extension
  - mobile
  - packages/shared-ui
  - packages/api-contract
  - packages/vault-core

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
blockExoticSubdeps: true
engineStrict: true
nodeVersion: 24.20.0
pmOnFail: error
verifyDepsBeforeRun: error
enableGlobalVirtualStore: false
strictDepBuilds: true
savePrefix: ""

allowBuilds:
  argon2: true
  dtrace-provider: false
  esbuild: true
  lefthook: true
  protobufjs: false
  sharp: true
  unrs-resolver: true
  react-native-libsodium: true
  react-native-nitro-modules: true
  '@shopify/react-native-skia': true

overrides:
  "@radix-ui/react-dismissable-layer": "1.1.11"
  "@babel/core@<=7.29.0": "7.29.7"
  "@tootallnate/once@<2.0.1": "2.0.1"
  "browserslist@<=4.28.6": "4.28.7"
  "brace-expansion": "5.0.12"
  "colord@<2.9.4": "2.9.4"
  "diff@>=4.0.0 <4.0.4": "4.0.4"
  "form-data@>=4.0.0 <4.0.6": "4.0.6"
  "glob@>=10.2.0 <10.5.0": "10.5.0"
  "js-yaml@<4.3.2": "4.3.2"
  "minimatch@<3.1.4": "3.1.4"
  "minimatch@>=5.0.0 <5.1.8": "5.1.8"
  "minimatch@>=9.0.0 <9.0.7": "9.0.7"
  "nanoid@<3.3.18": "3.3.18"
  "picomatch@<2.3.2": "2.3.2"
  "postcss@<=8.5.22": "8.5.23"
  "postcss-selector-parser@<7.1.6": "7.1.6"
  "rollup@>=4.0.0 <4.59.0": "4.60.4"
  "sharp@<0.35.4": "0.35.4"
  "source-map-js@>=1.0.0 <1.2.2": "1.2.2"
  "svgo@<4.1.0": "4.1.0"
  "tinypool@<2.1.2": "2.1.2"
  "ws@>=7.0.0 <7.5.11": "7.5.11"
  "ws@>=8.0.0 <8.20.1": "8.21.0"
  "yaml@>=2.0.0 <2.8.3": "2.8.3"
  "xcode@3.0.1>uuid": "11.1.1"
  "@expo/xcpretty@4.4.4>js-yaml": "4.3.2"
  "query-string@7.1.3>decode-uri-component": "0.5.0"

patchedDependencies:
