appId: com.cryptex.autofillfixture
name: Credential Manager password retrieval
---
# Run after autofill-provider-password-create.yaml, with the same vault.
- launchApp
- tapOn: Credential Manager passwords
- tapOn: Get password credential
- runFlow:
    when:
      visible: Unlock ${CRYPTEX_APP_NAME}
    commands:
      - tapOn: Unlock ${CRYPTEX_APP_NAME}
- runFlow:
    when:
      visible: Master password
    commands:
      - tapOn: Master password
      - inputText: CorrectHorseBatteryStaple42
      - hideKeyboard
      - tapOn:
          id: unlock-vault
- tapOn: cm-native@example.test
- runFlow:
    when:
      visible: Choose a login
    commands:
      - tapOn:
          text: com.cryptex.autofillfixture, cm-native@example.test, matches destination
- assertVisible: Review destination
- tapOn: Fill once
- assertVisible: "Credential Manager get complete: cm-native@example.test"
