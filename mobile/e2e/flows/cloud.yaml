appId: ${CRYPTEX_APP_ID}
name: Online Services fixture lifecycle
---
- runFlow: setup-online-services.yaml
- tapOn: More
- tapOn: Backup Center,.*
- tapOn: Managed backups,.*
- tapOn:
      id: managed-backups-switch
- assertVisible: Managed encrypted backups enabled.
- tapOn: Back up now
- assertVisible: Encrypted backup uploaded.
- tapOn: .*Root device.*
- assertVisible: Encrypted snapshot
- tapOn: Delete backup
- assertVisible: Permanently delete this encrypted backup?
- tapOn: Delete
- assertVisible: Backup deleted.
- runFlow:
      when:
          visible: Delete all backups
      commands:
          - tapOn: Delete all backups
          - assertVisible: Permanently delete every managed backup for this vault?
          - tapOn: Delete all
          - assertVisible: All backups deleted.
- assertVisible: Your next managed backup will appear here.
