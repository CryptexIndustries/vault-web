name: Browser extension

# extension-* tags build production. Run it by hand to build any branch with
# either profile. Values come from extension/release-config.json and
# extension/prerelease-config.json. Other pushes and pull requests that change
# something the extension uses only run the tests; tag pushes ignore the paths.
on:
    push:
        branches: [development, master]
        tags: ["extension-*"]
        paths:
            - "extension/**"
            - "web/src/**"
            - "packages/**"
            - "e2e/**"
            - "compose.e2e.yaml"
            - "patches/**"
            - "pnpm-workspace.yaml"
            - "pnpm-lock.yaml"
            - "package.json"
            - ".npmrc"
            - "scripts/install-lefthook.mjs"
            - ".github/workflows/extension.yml"
            - ".github/workflows/extension-browser.yml"
            - "!**/*.md"
    pull_request:
        paths:
            - "extension/**"
            - "web/src/**"
            - "packages/**"
            - "e2e/**"
            - "compose.e2e.yaml"
            - "patches/**"
            - "pnpm-workspace.yaml"
            - "pnpm-lock.yaml"
            - "package.json"
            - ".npmrc"
            - "scripts/install-lefthook.mjs"
            - ".github/workflows/extension.yml"
            - ".github/workflows/extension-browser.yml"
            - "!**/*.md"
    workflow_dispatch:
        inputs:
            profile:
                description: Configuration to build
                type: choice
                options: [preprod, production]
                default: preprod

permissions:
    contents: read

# The SHA gives every push its own group. GitHub keeps only one pending run per
# group, so a shared group would cancel a waiting push when the next one lands.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}-${{ inputs.profile || 'production' }}
    cancel-in-progress: false

jobs:
    # Each browser runs its own tests, then builds its own ZIP.
    chromium:
        name: Chromium
        uses: ./.github/workflows/extension-browser.yml
        with:
            browser: chromium
            package: ${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}
            profile: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'production' }}

    firefox:
        name: Firefox
        uses: ./.github/workflows/extension-browser.yml
        with:
            browser: firefox
            package: ${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}
            profile: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'production' }}

    # extension-v1.2.3 tags open a draft GitHub release with the 1.2.3 section
    # of extension/CHANGELOG.md and both ZIPs. Publishing it is a manual step.
    draft-release:
        name: Draft GitHub release
        needs: [chromium, firefox]
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/extension-v')
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  sparse-checkout: |
                      extension/CHANGELOG.md
                      scripts/draft-release.sh
                  sparse-checkout-cone-mode: false
            # The artifact is the bare ZIP (archive: false above). Without
            # skip-decompress, download-artifact unpacks it into dist/.
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: cryptex-vault-*
                  merge-multiple: true
                  skip-decompress: true
                  path: dist
            - name: Create draft release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_OUTRO: The Chrome Web Store and Firefox Add-ons updates follow after review.
              shell: bash
              run: scripts/draft-release.sh "Extension v${GITHUB_REF_NAME#extension-v}" extension/CHANGELOG.md dist/*.zip
