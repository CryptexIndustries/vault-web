# Client-only Docker Compose (no Postgres, Redis, or Cryptex Cloud API).
# Services use mutually exclusive profiles so only one binds port 3000.
#
# Local vault (default profile):
#   docker compose -f compose.prod.yaml --profile local --env-file web/.env.client.default up --build
#
# Self-hosted UI + hosted or separate cloud API:
#   cp web/.env.client.cloud-ui.default web/.env.client.cloud-ui
#   # edit NEXT_PUBLIC_ONLINE_SERVICES_API_URL and cloud client keys
#   docker compose -f compose.prod.yaml --profile cloud --env-file web/.env.client.cloud-ui up --build

name: cryptex-vault-client

x-client-build-args: &client-build-args
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
  NEXT_PUBLIC_CLOUD_ENABLED: ${NEXT_PUBLIC_CLOUD_ENABLED:-false}
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
  NEXT_PUBLIC_PUSHER_APP_ID: ${NEXT_PUBLIC_PUSHER_APP_ID:-local-disabled}
  NEXT_PUBLIC_PUSHER_APP_KEY: ${NEXT_PUBLIC_PUSHER_APP_KEY:-local-disabled}
  NEXT_PUBLIC_PUSHER_APP_HOST: ${NEXT_PUBLIC_PUSHER_APP_HOST:-localhost}
  NEXT_PUBLIC_PUSHER_APP_PORT: ${NEXT_PUBLIC_PUSHER_APP_PORT:-6004}
  NEXT_PUBLIC_PUSHER_APP_TLS: ${NEXT_PUBLIC_PUSHER_APP_TLS:-false}
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-pk_test_local}
  NEXT_PUBLIC_STRIPE_PREMIUM_PRODUCT_ID: ${NEXT_PUBLIC_STRIPE_PREMIUM_PRODUCT_ID:-prod_local000000000000}
  NEXT_PUBLIC_STRIPE_PREMIUM_MONTHLY_PRICE_ID: ${NEXT_PUBLIC_STRIPE_PREMIUM_MONTHLY_PRICE_ID:-price_local0000000000}
  NEXT_PUBLIC_STRIPE_PREMIUM_YEARLY_PRICE_ID: ${NEXT_PUBLIC_STRIPE_PREMIUM_YEARLY_PRICE_ID:-price_local0000000001}

services:
  web:
    profiles: ["local"]
    container_name: cryptex-vault-client-web
    build:
      context: .
      dockerfile: web/prod.Dockerfile
      args:
        <<: *client-build-args
    ports:
      - "${CLIENT_WEB_PORT:-3000}:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    restart: unless-stopped

  web-cloud:
    profiles: ["cloud"]
    container_name: cryptex-vault-client-web-cloud
    build:
      context: .
      dockerfile: web/prod.Dockerfile
      args:
        <<: *client-build-args
        NEXT_PUBLIC_CLOUD_ENABLED: "true"
        NEXT_PUBLIC_ONLINE_SERVICES_API_URL: ${NEXT_PUBLIC_ONLINE_SERVICES_API_URL:-}
    ports:
      - "${CLIENT_WEB_PORT:-3000}:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    restart: unless-stopped
