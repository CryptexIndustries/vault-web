appId: ${CRYPTEX_APP_ID}
name: Register disposable Online Services account
---
- runFlow: setup-vault.yaml
- tapOn: Account
- assertVisible: Get Online Services
- tapOn: Get Online Services
- assertVisible: Billing interval
- tapOn: Yearly,.*
- tapOn: Continue
- assertVisible: Save your Recovery Kit
- assertVisible: Hide phrase
- tapOn: Hide phrase
- assertVisible: Reveal recovery phrase
- tapOn: Reveal recovery phrase
- assertVisible: Hide phrase
- scrollUntilVisible:
      element:
          text: Copy Recovery Kit
      direction: DOWN
- tapOn: Copy Recovery Kit
- runFlow:
      when:
          visible:
              id: com.android.systemui:id/dismiss_button
      commands:
          - tapOn:
                id: com.android.systemui:id/dismiss_button
- scrollUntilVisible:
      element:
          text: I've saved my kit. Continue to payment
      direction: DOWN
- tapOn: I've saved my kit. Continue to payment
# New fixture accounts are on the free plan, so signup moves on to payment.
- runFlow:
      when:
          platform: Android
      commands:
          # Requesting the synthetic hosted checkout marks the account paid; no
          # Stripe payment runs. Coming back without a return link makes the
          # app check for the payment, and the fixture reports it.
          - assertVisible: .*checkout.stripe.com/c/pay/cs_test_cryptex_fixture_premiumYearly.*
          - launchApp:
                stopApp: false
          - extendedWaitUntil:
                visible: Welcome to Online Services.*
                timeout: 15000
          - tapOn: Done
          - assertVisible: Manage billing
# iOS sells through the App Store, which can't take a payment against the
# fixture. The account stays on the free plan, and the fixture grants every
# feature the suites use to free accounts too.
- runFlow:
      when:
          platform: iOS
      commands:
          - extendedWaitUntil:
                visible: Payment not completed.*
                timeout: 15000
          - tapOn: Not now
          - assertVisible: Upgrade membership
