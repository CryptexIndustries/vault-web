name: cryptex-vault-e2e

services:
    web:
        build:
            context: .
            dockerfile: web/prod.Dockerfile
        environment:
            HOSTNAME: "0.0.0.0"
            PORT: "3000"
            NEXT_PUBLIC_APP_URL: http://web:3000
            NEXT_PUBLIC_CLOUD_ENABLED: "false"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --no-verbose --tries=1 --spider http://0.0.0.0:3000/app || exit 1",
                ]
            interval: 2s
            timeout: 5s
            retries: 30
            start_period: 5s

    # Self-hosted linking servers, so two browsers can link without Online Services.
    signaling:
        image: quay.io/soketi/soketi:1.6-16-alpine@sha256:5e45fe1adbf2d4ef8022d0126a3c7e4371b7b08f35784b76a2dc353954ee885c
        environment:
            SOKETI_DEFAULT_APP_ID: e2e-app
            SOKETI_DEFAULT_APP_KEY: e2e-key
            SOKETI_DEFAULT_APP_SECRET: e2e-secret
            SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: "true"

    turn:
        image: coturn/coturn:4.6.3@sha256:71c3c990283385567f11794ee692e3a47b66fd9b0bb39e42afbe776e331dd888
        command:
            - --listening-port=3478
            - --realm=cryptex-e2e.local
            - --lt-cred-mech
            - --user=e2e:e2e-turn-password
            - --no-tls
            - --no-dtls
            - --no-cli
            - --log-file=stdout

    # S3-compatible storage for the backup destination tests. Each test makes
    # its own bucket and keys through the admin API.
    garage:
        image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
        command: ["/garage", "server", "--single-node"]
        volumes:
            - ./e2e/garage/garage.toml:/etc/garage.toml:ro
        tmpfs:
            - /var/lib/garage
        healthcheck:
            test: ["CMD", "/garage", "status"]
            interval: 1s
            timeout: 5s
            retries: 30

    garage-tls:
        image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
        volumes:
            - ./e2e/garage/Caddyfile:/etc/caddy/Caddyfile:ro
            - ./e2e/garage/tls:/etc/caddy/tls:ro
        depends_on:
            garage:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "nc", "-z", "127.0.0.1", "8443"]
            interval: 1s
            timeout: 5s
            retries: 30

    web-e2e:
        build:
            context: .
            dockerfile: web/e2e/Dockerfile
        init: true
        user: "${E2E_UID:-1000}:${E2E_GID:-1000}"
        ipc: host
        depends_on:
            web:
                condition: service_healthy
            signaling:
                condition: service_started
            turn:
                condition: service_started
            garage-tls:
                condition: service_healthy
        environment:
            CI: "true"
            HOME: /tmp
            E2E_BASE_URL: http://127.0.0.1:4174
            E2E_UPSTREAM_URL: http://web:3000
            E2E_GARAGE_S3_URL: http://garage:3900
            E2E_GARAGE_ADMIN_URL: http://garage:3903
            E2E_GARAGE_TLS_URL: https://garage-tls:8443
        volumes:
            - ./web/e2e:/app/web/e2e:ro
            - ./e2e:/app/e2e:ro
            - ./test-results:/app/test-results
            - ./playwright-report:/app/playwright-report
