appId: ${CRYPTEX_APP_ID}
name: Read the transfer phrase while the invitation waits
---
# The words sit just above Share file; read them before scrolling further down.
- scrollUntilVisible:
      element:
          text: "[a-z]+( [a-z]+){11}"
      direction: UP
- copyTextFrom: "[a-z]+( [a-z]+){11}"
- evalScript: ${console.log('E2E_TRANSFER_PHRASE:' + maestro.copiedText)}
- scrollUntilVisible:
      element:
          text: Waiting for other device.*
      direction: DOWN
