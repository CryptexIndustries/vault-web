name: CI

on:
  push:
    branches: [master, development]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    name: Lockfile specifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.8.0 --activate
      - name: Install frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Verify lockfile specifiers
        run: touch -c pnpm-lock.yaml && pnpm exec true

  # Temporarily disabled
  web-e2e:
    name: Web end-to-end
    needs: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    disabled: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.8.0 --activate
      - name: Run web end-to-end tests
        run: pnpm test:e2e:web
      - name: Upload web end-to-end artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-e2e
          path: |
            test-results/web-e2e
            playwright-report/web-e2e
          if-no-files-found: ignore
