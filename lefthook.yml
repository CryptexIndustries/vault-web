pre-commit:
  commands:
    oxfmt:
      glob: "{web,extension,packages}/**.{js,jsx,ts,tsx,json,jsonc,md,mdx,html,css,cjs,mjs,toml}"
      run: ./node_modules/.bin/pnpm exec oxfmt --write {staged_files}
      stage_fixed: true
    verify-lockfile:
      glob: "{package.json,pnpm-lock.yaml,pnpm-workspace.yaml,**/package.json}"
      run: touch -c pnpm-lock.yaml && ./node_modules/.bin/pnpm exec true

pre-push:
  commands:
    verify-lockfile:
      run: touch -c pnpm-lock.yaml && ./node_modules/.bin/pnpm exec true
