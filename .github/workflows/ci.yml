name: CI

on:
    push:
        branches: [master, development]
        tags: ["**"]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    # Preserve tag builds so concurrent release pushes do not cancel publishing.
    cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/development' }}

jobs:
    lockfile:
        name: Lockfile specifiers
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.16.0
            - name: Enable pnpm
              run: corepack enable && corepack prepare pnpm@11.25.0 --activate
            - name: Install frozen lockfile
              run: pnpm install --frozen-lockfile
            - name: Verify lockfile specifiers
              run: touch -c pnpm-lock.yaml && pnpm exec true

    web-quality:
        name: Web quality
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.16.0
            - name: Enable pnpm
              run: corepack enable && corepack prepare pnpm@11.25.0 --activate
            - name: Install frozen lockfile
              run: pnpm install --frozen-lockfile
            - name: Lint web client
              run: pnpm lint:web
            - name: Type-check web client
              run: pnpm lint-tsc:web
            - name: Type-check shared packages
              run: pnpm lint-tsc:packages
            - name: Test web client
              run: pnpm exec jest web/tests --runInBand

    services-quality:
        name: Go services quality
        runs-on: ubuntu-latest
        timeout-minutes: 15
        container:
            image: golang:1.26@sha256:d7722066f0b60ceccb6c0643cbed1f5f9e15506ac237146c95333504d7805d89
        defaults:
            run:
                working-directory: services
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Check formatting
              run: test -z "$(gofmt -l .)"
            - name: Vet Go services
              run: go vet ./...
            # The cryptex-agent end-to-end tests log in to a local sshd.
            - name: Install OpenSSH server
              run: apt-get update -qq && apt-get install -y -qq --no-install-recommends openssh-server
            - name: Test Go services
              run: go test -race ./...
            - name: Verify Go module checksums
              run: go mod verify
            # Fails on known vulnerabilities in code paths we actually call, in
            # dependencies and in this Go toolchain's standard library. Release
            # jobs need this job, so nothing ships past a known vulnerability.
            - name: Audit Go dependencies
              run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

    extension-quality:
        name: Extension quality
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.16.0
            - name: Enable pnpm
              run: corepack enable && corepack prepare pnpm@11.25.0 --activate
            - name: Install frozen lockfile
              run: pnpm install --frozen-lockfile
            - name: Lint extension
              run: pnpm lint:ext
            - name: Type-check extension
              run: pnpm --filter extension lint-tsc
            - name: Test production configuration validation
              run: |
                  node --test extension/scripts/release-config.test.mjs
                  pnpm exec jest extension/tests/production-env.test.ts --runInBand

    # Temporarily disabled
    web-e2e:
        name: Web end-to-end
        needs: [lockfile, web-quality]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        if: ${{ false }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.16.0
            - name: Enable pnpm
              run: corepack enable && corepack prepare pnpm@11.25.0 --activate
            - name: Run web end-to-end tests
              run: pnpm test:e2e:web
            - name: Upload web end-to-end artifacts
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: web-e2e
                  path: |
                      test-results/web-e2e
                      playwright-report/web-e2e
                  if-no-files-found: ignore

    # Temporarily disabled
    extension-live-e2e:
        name: Extension live Autofill smoke
        needs: lockfile
        runs-on: ubuntu-latest
        timeout-minutes: 30
        if: ${{ false }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.16.0
            - name: Enable pnpm
              run: corepack enable && corepack prepare pnpm@11.25.0 --activate
            - name: Install frozen lockfile
              run: pnpm install --frozen-lockfile
            - name: Install Chromium
              run: pnpm exec playwright install --with-deps chromium
            - name: Run live Autofill smoke test
              run: pnpm test:e2e:extension:live
            - name: Upload live Autofill smoke artifacts
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: extension-live-e2e
                  path: |
                      test-results/e2e
                      playwright-report/extension-e2e
                  if-no-files-found: ignore

    container-image:
        name: Production container image
        needs: [lockfile, web-quality]
        if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'web-v')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Derive lowercase GHCR image name and tags
              id: image
              shell: bash
              run: |
                  repository="${GITHUB_REPOSITORY,,}"
                  image="ghcr.io/${repository}"

                  tag=""
                  if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
                    tag="${GITHUB_REF_NAME//[^a-zA-Z0-9_.-]/-}"
                    tag="${tag:0:128}"
                    if [[ ! "${tag}" =~ ^[a-zA-Z0-9_] ]]; then
                      tag="tag-${tag:0:124}"
                    fi
                  fi

                  {
                    echo "name=${image}"
                    echo "tags<<EOF"
                    echo "${image}:${GITHUB_SHA}"
                    if [[ -n "${tag}" ]]; then echo "${image}:${tag}"; fi
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Validate Docker Swarm stack
              env:
                  APP_IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
              run: |
                  if env -u APP_IMAGE docker stack config -c compose.swarm.yaml >/dev/null 2>&1; then
                    echo "compose.swarm.yaml must reject a missing APP_IMAGE" >&2
                    exit 1
                  fi
                  docker stack config -c compose.swarm.yaml >/dev/null

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and publish web image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
              with:
                  context: .
                  file: web/prod.Dockerfile
                  push: true
                  tags: ${{ steps.image.outputs.tags }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                  cache-from: type=gha,scope=web-production
                  cache-to: type=gha,mode=max,scope=web-production

    share-server-image:
        name: Share server container image
        needs: [services-quality]
        # Released on its own tags so web releases never restart it.
        if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'share-server-v')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Derive lowercase GHCR image name and tags
              id: image
              shell: bash
              run: |
                  repository="${GITHUB_REPOSITORY,,}"
                  image="ghcr.io/${repository}/share-server"

                  # share-server-v1.2.3 publishes the image tag v1.2.3.
                  version="${GITHUB_REF_NAME#share-server-}"
                  if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
                    echo "Release tags look like share-server-v1.2.3 or share-server-v1.2.3-rc1, not ${GITHUB_REF_NAME}" >&2
                    exit 1
                  fi

                  {
                    echo "name=${image}"
                    echo "tags<<EOF"
                    echo "${image}:${GITHUB_SHA}"
                    echo "${image}:${version}"
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Validate Docker Swarm stack
              env:
                  SHARE_IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
              run: |
                  if env -u SHARE_IMAGE docker stack config -c services/cmd/share-server/compose.swarm.yaml >/dev/null 2>&1; then
                    echo "services/cmd/share-server/compose.swarm.yaml must reject a missing SHARE_IMAGE" >&2
                    exit 1
                  fi
                  docker stack config -c services/cmd/share-server/compose.swarm.yaml >/dev/null

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and publish share server image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
              with:
                  context: services
                  file: services/cmd/share-server/Dockerfile
                  push: true
                  tags: ${{ steps.image.outputs.tags }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                  cache-from: type=gha,scope=share-server-production
                  cache-to: type=gha,mode=max,scope=share-server-production

    relay-server-image:
        name: Agent relay container image
        needs: [services-quality]
        # Released on its own tags so web releases never restart it.
        if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'relay-server-v')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Derive lowercase GHCR image name and tags
              id: image
              shell: bash
              run: |
                  repository="${GITHUB_REPOSITORY,,}"
                  image="ghcr.io/${repository}/relay-server"

                  # relay-server-v1.2.3 publishes the image tag v1.2.3.
                  version="${GITHUB_REF_NAME#relay-server-}"
                  if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
                    echo "Release tags look like relay-server-v1.2.3 or relay-server-v1.2.3-rc1, not ${GITHUB_REF_NAME}" >&2
                    exit 1
                  fi

                  {
                    echo "name=${image}"
                    echo "tags<<EOF"
                    echo "${image}:${GITHUB_SHA}"
                    echo "${image}:${version}"
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Validate Docker Swarm stack
              env:
                  RELAY_IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
                  # Required by the stack too; a placeholder is enough to validate it.
                  RELAY_PUBLIC_URL: https://relay.example.invalid
              run: |
                  if out=$(env -u RELAY_IMAGE docker stack config -c services/cmd/relay-server/compose.swarm.yaml 2>&1); then
                    echo "services/cmd/relay-server/compose.swarm.yaml must reject a missing RELAY_IMAGE" >&2
                    exit 1
                  fi
                  if ! grep -q 'RELAY_IMAGE' <<<"${out}"; then
                    echo "docker stack config failed without RELAY_IMAGE, but not because of it:" >&2
                    echo "${out}" >&2
                    exit 1
                  fi
                  docker stack config -c services/cmd/relay-server/compose.swarm.yaml >/dev/null

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and publish relay image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
              with:
                  context: services
                  file: services/cmd/relay-server/Dockerfile
                  push: true
                  tags: ${{ steps.image.outputs.tags }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                  cache-from: type=gha,scope=relay-server-production
                  cache-to: type=gha,mode=max,scope=relay-server-production
