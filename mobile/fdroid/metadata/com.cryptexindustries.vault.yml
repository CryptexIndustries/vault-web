    en-US: Optional Online Services account verification uses Cloudflare Turnstile;
      subscription billing uses Stripe and managed backups use Backblaze B2.
Categories:
  - Security
License: AGPL-3.0-only
AuthorName: Cryptex Industries
WebSite: https://www.cryptex-vault.com
SourceCode: https://github.com/CryptexIndustries/vault-web
IssueTracker: https://github.com/CryptexIndustries/vault-web/issues

AutoName: Cryptex Vault

RepoType: git
Repo: https://github.com/CryptexIndustries/vault-web.git
Binaries: https://github.com/CryptexIndustries/vault-web/releases/download/mobile-v%v/cryptex-vault-fdroid.apk

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: PUBLISH_RELEASE_COMMIT
    sudo:
      - apt-get update
      - apt-get install -y curl xz-utils unzip make perl golang-go g++ ninja-build rustup openjdk-21-jdk-headless
      - echo 'deb https://deb.debian.org/debian forky main' > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y --no-install-recommends -t forky nodejs=24.21.0+dfsg+~cs24.13.4-1
        node-corepack
      - corepack enable pnpm
      - corepack prepare pnpm@11.25.0 --activate
    output: mobile/dist/cryptex-vault-fdroid-unsigned.apk
    srclibs:
      - esbuild@208f539945b145e7c9d6d844290f81c3fe5af320
      - LightningCSS@eb49015cf887ae720b80a2856ccbdf61bf940ef1
      - skia@4502f88af90279ad2685528bd3cf7e90ab140f19
      - GN@b2afae122eeb6ce09c52d63f67dc53fc517dbdc8
      - OpenSSL@f4dc4d58b48d346a8270183f89acf826d459b0ca
    prebuild:
      - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
        ANDROID_HOME=$$SDK$$ ANDROID_SDK_ROOT=$$SDK$$
        CRYPTEX_RELEASE_CONFIG=/tmp/cryptex-release-config.json
      - rm -f local.properties
      - sdkmanager --sdk_root=$$SDK$$ 'platforms;android-36' 'build-tools;36.0.0'
        'build-tools;34.0.0' 'cmake;3.22.1'
      - rustup default 1.76.0
      - pnpm install --frozen-lockfile --ignore-scripts --filter mobile...
      - curl -fL https://github.com/CryptexIndustries/vault-web/releases/download/mobile-v$$VERSION$$/release-config.json
        -o /tmp/cryptex-release-config.json
      - echo 'PUBLISH_RELEASE_CONFIG_SHA256  /tmp/cryptex-release-config.json' | sha256sum --check --strict
      - node mobile/fdroid/build.mjs prebuild
      - sed -i 's/jvmToolchain(17)/jvmToolchain(21)/g'
        node_modules/.pnpm/expo-modules-core@*/node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - rm -rf $$skia$$/platform_tools
      - node mobile/fdroid/skia-source.mjs fetch $$skia$$ $$GN$$
      - cd $$esbuild$$ && rm -rf npm && go mod download
      - cd $$LightningCSS$$ && cargo fetch --locked
    scanignore:
      - node_modules/.pnpm/hermes-compiler@250829098.0.14/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
    build:
      - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
        ANDROID_HOME=$$SDK$$ ANDROID_SDK_ROOT=$$SDK$$
        CRYPTEX_RELEASE_CONFIG=/tmp/cryptex-release-config.json
      - CRYPTEX_GRADLE_COMMAND=gradle CRYPTEX_OPENSSL_SOURCE=$$OpenSSL$$ node mobile/fdroid/build.mjs
        build $$esbuild$$ $$LightningCSS$$ $$skia$$ $$GN$$
    ndk: 27.1.12297006

AllowedAPKSigningKeys: aa084b878eac0403b30b05c82ced96acfd72b9c94a5964e7aeaaab849b60e7df

MaintainerNotes: |-
  This source-repository template needs the full public release commit in its
  fdroiddata submission copy. Replace PUBLISH_RELEASE_COMMIT with the full
  commit hash of mobile-v0.1.0 before submission.
  Replace PUBLISH_RELEASE_CONFIG_SHA256 with the checksum of that release's
  public release-config.json asset. CI materializes both values in its submission.
  Binaries supplies the developer-signed reference APK for each release.
  Keep AllowedAPKSigningKeys pinned. After initial
  acceptance, AutoUpdateMode can become Version mobile-v%v for future releases
  selected by the mobile-only tag and app.json version/code checks.

  Online Services are optional. This distribution disables Expo OTA updates.
  The only source scan exception is the exact official Hermes compiler path,
  permitted by the inclusion policy. esbuild and the Lightning CSS 1.27.0
  Node addon are compiled from pinned source libraries after scanning.
  Lightning CSS uses its upstream-pinned Rust 1.76.0 and locked Cargo inputs.
  React Native Skia 2.6.2's npm archives and web CanvasKit binaries are removed.
  Its pinned GN tool and nine Ganesh archives per Android ABI compile from
  source after scanning. Eleven codec/font source revisions come from the
  pinned Skia DEPS; depot_tools, CIPD and upstream tool downloaders are not run.
  Cleanup removes all prebuilt Node addons and fails on unreviewed .node files,
  which fdroidserver 2.4.5 can otherwise miss. It removes versioned unused paths
  and checksum-reviewed obsolete local/publishing Maven declarations.

  Build from the repository root. Localized listing files are in
  fastlane/metadata/android. Expo prebuild runs once before scanning;
  the build phase uses installed Gradle and never regenerates native sources.

AutoUpdateMode: None
UpdateCheckMode: Tags ^mobile-v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: mobile/app.json|"versionCode"\s*:\s*(\d+)|.|"version"\s*:\s*"([^"]+)"
CurrentVersion: 0.1.0
CurrentVersionCode: 1
