appId: ${CRYPTEX_APP_ID}
name: Chrome autofill after background auto-lock
---
- openLink: ${CRYPTEX_APP_SCHEME}://
- runFlow: autofill-browser-unlock-if-needed.yaml
- assertVisible: Search your vault
- tapOn: More
- tapOn: Security
- tapOn: Auto-lock
- tapOn: 1 minute
- launchApp: com.android.chrome
- openLink: http://localhost:43110/fresh-auto-lock-wait?case=background-auto-lock
- assertVisible: Background auto-lock fixture
- assertVisible: Waiting for the one-minute auto-lock interval
- assertVisible: localhost:43110/auto-lock-wait\?case=background-auto-lock&fresh=[0-9]+-[0-9]+
# Chrome can paint the elapsed state while hiding the page from accessibility
# after many prior Autofill callbacks. The timer also marks the browser URL.
- extendedWaitUntil:
    visible: localhost:43110/auto-lock-wait\?case=background-auto-lock&fresh=[0-9]+-[0-9]+&elapsed=1
    timeout: 90000
- openLink: http://localhost:43110/fresh-login?case=background-auto-lock
- runFlow: autofill-browser-dismiss-tips.yaml
- assertVisible: Login fields empty
- tapOn: Username.*
- tapOn: .*${CRYPTEX_APP_NAME}
- assertVisible: Master password
# The visible label is a separate TextView. Target the input placeholder.
- tapOn: Enter master password
- inputText: CorrectHorseBatteryStaple42
- hideKeyboard
- tapOn:
    id: unlock-vault
- assertVisible: Choose a login
- assertVisible: Android could not confirm.*browser page and login field.*
- tapOn: Fixture Login, fixture@example.test.*
- assertVisible: Review destination
- tapOn: Fill once
- tapOn:
    point: 60%,28%
- assertVisible: localhost:43110/login/otp\?accepted=1&empty=0

# Restore the suite's starting auto-lock setting.
- openLink: ${CRYPTEX_APP_SCHEME}://
- tapOn: More
- tapOn: Security
- tapOn: Auto-lock
- tapOn: 5 minutes
