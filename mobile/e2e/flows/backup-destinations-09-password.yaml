appId: ${CRYPTEX_APP_ID}
name: A password change with key rotation replaces this device's backups
---
- launchApp:
      stopApp: false
- tapOn: More
- tapOn: Security,.*
- tapOn: Master password,.*
- tapOn:
      id: current-master-password
- inputText: CorrectHorseBatteryStaple42
- tapOn:
      id: new-master-password
- inputText: GarageRotatedPassword77
- tapOn: Confirm new master password
- inputText: GarageRotatedPassword77
- runFlow: hide-keyboard.yaml
- scrollUntilVisible:
      element:
          text: Delete older destination backups after replacement
      direction: DOWN
- tapOn:
      id: rotate-data-key
- tapOn:
      id: delete-older-destination-backups
- scrollUntilVisible:
      element:
          text: Change password
      direction: DOWN
- tapOn: Change password
- extendedWaitUntil:
      visible: I saved my new vault recovery code.
      timeout: 60000
- tapOn: I saved my new vault recovery code.
- tapOn: Finish
- scrollUntilVisible:
      element:
          text: Security settings and vault encryption key updated.*
      direction: DOWN
      timeout: 10000
- tapOn: Back
- tapOn: Back
- tapOn:
      text: Vault
      below: Security,.*
- assertVisible: Search your vault
