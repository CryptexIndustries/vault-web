name: Mobile Google Play

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Production requires a mobile-v release tag; preprod builds the selected branch
        required: true
        default: production
        type: choice
        options: [production, preprod]

permissions:
  contents: read

concurrency:
  group: mobile-google-play-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and sign Google Play APK and AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: ${{ inputs.profile == 'production' && 'Mobile - Production' || 'Mobile - Preproduction' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate release selection and public Play configuration
        env:
          RELEASE_PROFILE: ${{ inputs.profile }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';
          import { getProfile } from './mobile/scripts/release-config.mjs';
          import play from './mobile/config/play.cjs';
          const profile = getProfile(process.env.RELEASE_PROFILE);
          if (profile.name === 'production') {
            const app = JSON.parse(readFileSync('mobile/app.json', 'utf8')).expo;
            assert.equal(process.env.GITHUB_REF_TYPE, 'tag', 'Run production on a mobile-v release tag.');
            assert.equal(process.env.GITHUB_REF_NAME, `mobile-v${app.version}`, 'Release tag must match the application version.');
          }
          const configPath = `mobile/${profile.configFile}`;
          play.loadDistributionConfig(configPath, 'play');
          appendFileSync(process.env.GITHUB_ENV, `RELEASE_CONFIG=${configPath}\n`);
          NODE

      - name: Install pinned Android build tools
        run: |
          test -n "$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses < <(printf 'y\n%.0s' {1..100})
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" "build-tools;36.0.0" "build-tools;34.0.0" \
            "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check mobile
        run: pnpm mobile:check

      - name: Build and verify unsigned Play artifacts
        env:
          RELEASE_PROFILE: ${{ inputs.profile }}
        run: pnpm mobile:build:play -- --profile "$RELEASE_PROFILE" --config "$RELEASE_CONFIG" --unsigned --clean --jobs 2 --heap 4096

      - name: Sign and verify APK and AAB
        env:
          RELEASE_PROFILE: ${{ inputs.profile }}
          CRYPTEX_KEYSTORE_BASE64: ${{ secrets.CRYPTEX_KEYSTORE_BASE64 }}
          CRYPTEX_KEYSTORE_PASSWORD: ${{ secrets.CRYPTEX_KEYSTORE_PASSWORD }}
          CRYPTEX_KEY_PASSWORD: ${{ secrets.CRYPTEX_KEY_PASSWORD }}
        run: |
          cp "$RELEASE_CONFIG" mobile/dist/release-config.json
          node mobile/scripts/ci-release.mjs sign "$RELEASE_PROFILE" mobile/dist play

      - name: Upload signed artifacts, receipts and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-google-play-release-${{ github.run_id }}
          path: mobile/dist/
          if-no-files-found: error
