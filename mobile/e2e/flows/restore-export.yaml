appId: ${CRYPTEX_APP_ID}
name: Restore the actual encrypted export into a clean installation
---
- clearState
- launchApp
- assertVisible: Vault name
- tapOn: Restore backup
- runFlow:
      when:
          notVisible: Choose .cryx backup file
      commands:
          - tapOn: Restore backup
- tapOn: Choose .cryx backup file
- runFlow:
      file: pick-exported-file.yaml
      env:
          EXPORTED_FILE: e2e-export.cryx
- assertVisible: After restore, unlock with the existing master password.*
# The backup source options push the name field below the fold on Android.
- runFlow:
      when:
          platform: Android
      commands:
          - scrollUntilVisible:
                element:
                    text: Restored vault name
                direction: DOWN
                centerElement: true
- tapOn: Restored vault name
- eraseText: 100
- inputText: E2E Restored Vault
- runFlow: hide-keyboard.yaml
- scrollUntilVisible:
      element:
          id: restore-vault
      direction: DOWN
- tapOn:
      id: restore-vault
- assertVisible: Backup restored. Unlock it to continue.
- extendedWaitUntil:
      visible: Master password
      timeout: 10000
- tapOn:
      id: unlock-master-password
- inputText: WrongPassword42
- runFlow: hide-keyboard.yaml
- tapOn:
      id: unlock-vault
- assertVisible: That password could not unlock this vault. Check it and try again.
- assertNotVisible: E2E Transfer Login.*
- tapOn:
      id: unlock-master-password
- eraseText: 100
- inputText: CorrectHorseBatteryStaple42
- runFlow: hide-keyboard.yaml
- tapOn:
      id: unlock-vault
- assertVisible: E2E Transfer Login.*
- tapOn: E2E Transfer Login.*
- assertVisible: transfer@example.test
- assertVisible: https://transfer.example.test/login.*
- tapOn: Reveal Password
- assertVisible: transfer-password-42
- tapOn: Back
- stopApp
- launchApp
- tapOn:
      id: unlock-master-password
- inputText: CorrectHorseBatteryStaple42
- runFlow: hide-keyboard.yaml
- tapOn:
      id: unlock-vault
- assertVisible: E2E Transfer Login.*
