appId: ${CRYPTEX_APP_ID}
name: Chrome cross-origin frame isolation
---
- launchApp: com.android.chrome
- openLink: http://localhost:43110/fresh-frame-origin?case=frame
- runFlow: autofill-browser-dismiss-tips.yaml
- assertVisible: Frame origin fixture
- assertVisible: .*Page empty.*
- assertVisible: .*Visible frame empty.*
- assertVisible: .*Off-screen frame empty.*
- tapOn: Frame username.*
- tapOn: .*${CRYPTEX_APP_NAME}
- runFlow: autofill-browser-unlock-if-needed.yaml
- assertVisible: Android could not confirm.*browser page and login field.*
- tapOn: Fixture Login, fixture@example.test.*
- assertVisible: Review destination
- tapOn: Fill once
- runFlow:
    when:
      visible: Chrome
    commands:
      - tapOn: Chrome
# Chrome 134 may hide the page's accessibility tree after Autofill returns.
# The fixed fixture button (pinned 1080x2400 AVD) records only fill states in
# the URL, including the off-screen frame.
- tapOn:
    point: 84%,14%
- assertVisible: localhost:43110/frame-check\?case=frame&page=empty&visible=filled&offscreen=empty

# A fresh page request fills the top-level form, not either frame.
- openLink: http://localhost:43110/fresh-frame-origin?case=page
- runFlow: autofill-browser-dismiss-tips.yaml
- assertVisible: .*Page empty.*
- assertVisible: .*Visible frame empty.*
- assertVisible: .*Off-screen frame empty.*
- tapOn: Page username.*
- tapOn: .*${CRYPTEX_APP_NAME}
- runFlow: autofill-browser-unlock-if-needed.yaml
- assertVisible: Android could not confirm.*browser page and login field.*
- tapOn: Fixture Login, fixture@example.test.*
- assertVisible: Review destination
- tapOn: Fill once
- runFlow:
    when:
      visible: Chrome
    commands:
      - tapOn: Chrome
- tapOn:
    point: 84%,14%
- assertVisible: localhost:43110/frame-check\?case=page&page=filled&visible=empty&offscreen=empty
