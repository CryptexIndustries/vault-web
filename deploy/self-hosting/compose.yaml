name: cryptex-self-hosted

x-logging: &logging
    driver: json-file
    options:
        max-size: "10m"
        max-file: "3"

services:
    web:
        image: ${VAULT_IMAGE:?Set VAULT_IMAGE in .env}
        environment:
            NEXT_PUBLIC_APP_URL: https://${VAULT_DOMAIN:?Set VAULT_DOMAIN in .env}
            NEXT_PUBLIC_CLOUD_ENABLED: "false"
            HOSTNAME: 0.0.0.0
            PORT: "3000"
            # Forwards https://VAULT_DOMAIN/share-api/* to the share server.
            SHARE_SERVER_INTERNAL_URL: http://share:8080
        depends_on:
            - share
        restart: unless-stopped
        logging: *logging
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/app"]
            interval: 30s
            timeout: 5s
            start_period: 60s
            retries: 3

    caddy:
        image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
        environment:
            VAULT_DOMAIN: ${VAULT_DOMAIN:?Set VAULT_DOMAIN in .env}
            SIGNAL_DOMAIN: ${SIGNAL_DOMAIN:?Set SIGNAL_DOMAIN in .env}
            TURN_DOMAIN: ${TURN_DOMAIN:?Set TURN_DOMAIN in .env}
            ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
        ports:
            - "80:80/tcp"
            - "443:443/tcp"
        volumes:
            - type: bind
              source: ./Caddyfile
              target: /etc/caddy/Caddyfile
              read_only: true
              bind:
                  create_host_path: false
            - type: bind
              source: /var/lib/cryptex-acme
              target: /var/www/acme
              read_only: true
              bind:
                  create_host_path: false
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            - web
            - soketi
            - relay
        restart: unless-stopped
        logging: *logging

    # One-time share links (https://VAULT_DOMAIN/s/<id>). Stores ciphertext
    # and token hashes only; the key stays in the link.
    share:
        image: ${SHARE_IMAGE:?Set SHARE_IMAGE in .env}
        environment:
            SHARE_AUTH: token
            SHARE_CREATION_TOKENS: ${SHARE_CREATION_TOKENS:?Set SHARE_CREATION_TOKENS in .env}
            # Caddy sets the address it saw and the web container passes the
            # header through, so the client is the last entry. Behind a CDN,
            # see the self-hosting guide before changing these.
            SHARE_CLIENT_IP_HEADER: ${SHARE_CLIENT_IP_HEADER:-X-Forwarded-For}
            SHARE_TRUSTED_PROXY_HOPS: ${SHARE_TRUSTED_PROXY_HOPS:-1}
            # Prometheus metrics on port 9090, never published; "off" turns them off.
            SHARE_METRICS_ADDR: ${SHARE_METRICS_ADDR:-:9090}
        volumes:
            - share_data:/data
        restart: unless-stopped
        logging: *logging

    # SSH agent relay for cryptex-agent. Caddy sends /v1/connect, /v1/pair and
    # /v1/revoke on VAULT_DOMAIN here, so the relay URL is https://VAULT_DOMAIN.
    # Requests are end-to-end encrypted; the SQLite file holds public keys only.
    relay:
        image: ${RELAY_IMAGE:?Set RELAY_IMAGE in .env}
        environment:
            # Clients sign this origin; it must match the URL they pair with.
            RELAY_PUBLIC_URL: https://${VAULT_DOMAIN:?Set VAULT_DOMAIN in .env}
            RELAY_AUTH_MODE: token
            RELAY_ACCESS_TOKEN: ${RELAY_ACCESS_TOKEN:?Set RELAY_ACCESS_TOKEN in .env}
            # Agents allowed on the whole relay.
            RELAY_MAX_AGENTS: ${RELAY_MAX_AGENTS:-25}
            # Clients ping after this many idle seconds. Behind Cloudflare,
            # which drops WebSockets idle for 100 seconds, use 90.
            RELAY_KEEPALIVE_SECONDS: ${RELAY_KEEPALIVE_SECONDS:-240}
            # Caddy sets the address it saw, so the client is the last entry.
            RELAY_CLIENT_IP_HEADER: ${RELAY_CLIENT_IP_HEADER:-X-Forwarded-For}
            RELAY_TRUSTED_PROXY_HOPS: ${RELAY_TRUSTED_PROXY_HOPS:-1}
            # Prometheus metrics on port 9090, never published; "off" turns them off.
            RELAY_METRICS_ADDR: ${RELAY_METRICS_ADDR:-:9090}
        volumes:
            - relay_data:/data
        restart: unless-stopped
        logging: *logging

    soketi:
        image: quay.io/soketi/soketi:1.6-16-alpine@sha256:5e45fe1adbf2d4ef8022d0126a3c7e4371b7b08f35784b76a2dc353954ee885c
        environment:
            SOKETI_DEFAULT_APP_ID: ${SOKETI_APP_ID:?Set SOKETI_APP_ID in .env}
            SOKETI_DEFAULT_APP_KEY: ${SOKETI_APP_KEY:?Set SOKETI_APP_KEY in .env}
            SOKETI_DEFAULT_APP_SECRET: ${SOKETI_APP_SECRET:?Set SOKETI_APP_SECRET in .env}
            SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: "true"
            SOKETI_DEFAULT_APP_MAX_CONNS: "100"
            SOKETI_DEFAULT_APP_MAX_CLIENT_EVENTS_PER_SEC: "100"
            SOKETI_DEBUG: "false"
        restart: unless-stopped
        logging: *logging

    coturn:
        image: coturn/coturn:4.6.3@sha256:71c3c990283385567f11794ee692e3a47b66fd9b0bb39e42afbe776e331dd888
        user: "${TURN_UID:?Set TURN_UID to id -u}:${TURN_GID:?Set TURN_GID to id -g}"
        # Linux host networking avoids Docker NAT across the relay port range.
        network_mode: host
        command: ["-c", "/etc/coturn/turnserver.conf"]
        volumes:
            - type: bind
              source: ./turnserver.conf
              target: /etc/coturn/turnserver.conf
              read_only: true
              bind:
                  create_host_path: false
            - type: bind
              source: /etc/cryptex-turn/tls
              target: /etc/coturn/tls
              read_only: true
              bind:
                  create_host_path: false
        restart: unless-stopped
        logging: *logging

volumes:
    caddy_data:
    caddy_config:
    share_data:
    relay_data:
