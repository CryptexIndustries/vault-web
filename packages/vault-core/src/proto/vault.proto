syntax = "proto3";

package VaultUtilTypes;

//#region Encryption
message KeyDerivationConfig_Argon2ID {
    int32 memLimit = 7;
    int32 opsLimit = 8;
}

message KeyDerivationConfig_PBKDF2 {
    int32 iterations = 4;
}

enum EncryptionAlgorithm {
    AES256 = 0;
    XChaCha20Poly1305 = 1;
}
enum KeyDerivationFunction {
    PBKDF2 = 0;
    Argon2ID = 1;
}

enum AdditionalKeyProtectionKind {
    NONE = 0;
    PROTECTION_PHRASE_128 = 1;
    PROTECTION_PHRASE_256 = 2;
    WEBAUTHN_PRF = 3;
}

enum KeySlotKind {
    PRIMARY = 0;
    RECOVERY = 1;
}

message KeySlot {
    KeySlotKind Kind = 1;
    bytes WrappedDEK = 2;
    string WrapAlgo = 3;
    string Salt = 4;
    KeyDerivationConfig_Argon2ID KDFConfigArgon2ID = 5;
    string HKDFSalt = 6;
    string HKDFInfo = 7;
    AdditionalKeyProtectionKind ProtectionKind = 8;

    // WebAuthn PRF protection metadata (non-secret). Stored in the synced
    // envelope so protection does not depend on device-local IndexedDB state.
    // Base64 credential id, needed for the assertion allowCredentials list.
    string WebauthnCredentialId = 9;
    // Base64 PRF eval salt, needed to reproduce the PRF output on unlock.
    string WebauthnPrfSalt = 10;
    // Base64 salt used to derive reproducible protection-phrase key material.
    string ProtectionPhraseSalt = 11;
}

message KeyEnvelope {
    int32 Version = 1;
    string DEKAlgo = 2;
    repeated KeySlot Slots = 3;
    AdditionalKeyProtectionKind PrimaryProtectionKind = 4;
    // Stable vault identifier used for KEK context.
    string VaultID = 5;
}
//#endregion Encryption

//#region Vault Metadata
message VaultMetadata {
    // The version of the vault as the point of creation
    int32 Version = 1;
    optional int32 DBIndex = 2;
    string Name = 3;
    string Description = 4;
    string CreatedAt = 5;
    optional string LastUsed = 6;
    string Icon = 7;
    string Color = 8;
    optional EncryptedBlob Blob = 9;
}

message EncryptedBlob {
    // The version of the vault as the point of creation
    int32 Version = 8;
    // The current version of the vault, which chages when the vault is upgraded
    int32 CurrentVersion = 9;
    EncryptionAlgorithm Algorithm = 1;
    KeyDerivationFunction KeyDerivationFunc = 2;

    KeyDerivationConfig_Argon2ID KDFConfigArgon2ID = 3;
    KeyDerivationConfig_PBKDF2 KDFConfigPBKDF2 = 4;

    bytes Blob = 5;
    string Salt = 6;
    string HeaderIV = 7;
    optional KeyEnvelope Envelope = 10;
}
//#endregion Vault Metadata

enum ItemType {
    // Missing or unknown types read as ordinary credentials.
    Unspecified = 0;
    Credentials = 1;
    Note = 2;
    Identity = 3;
    Passkey = 4;
    SSHKey = 5;
}

enum CustomFieldType {
    Text = 0;
    MaskedText = 1;
    Boolean = 2;
    Date = 3;
}

message CustomField {
    string ID = 1;
    string Name = 2;
    CustomFieldType Type = 3;
    string Value = 4;
}

message Vault {
    // The version of the vault as the point of creation
    int32 Version = 1;
    // The current version of the vault, which chages when the vault is upgraded
    int32 CurrentVersion = 8;

    reserved 2; reserved "Secret";

    reserved 3; reserved "Configuration";

    LinkedDevices LinkedDevices = 4;
    reserved 5; reserved "Groups";
    repeated Credential Credentials = 6;

    reserved 7; reserved "Diffs";

    // Cryptex Vault Online Services - server auth (device signing key material); separate from device sync
    optional OnlineServices OnlineServices = 9;
    repeated Directory Directories = 10;
    // One-time share links this vault created (sender side). Synced.
    repeated ShareLink ShareLinks = 11;
    // Which share server this device uses. Device-local, not synced.
    optional ShareSettings ShareSettings = 12;
    // Keyless SSH agents (cryptex-agent) paired with one of this vault's
    // devices. Synced.
    repeated ConnectedAgent ConnectedAgents = 13;
    // This device's SSH agent approver keys and agent relay settings.
    // Device-local: stripped wherever the vault leaves this device (linking,
    // backups, managed backups), never synced or exported.
    optional AgentApproverSettings AgentApprover = 14;
    // S3-compatible buckets every device uploads encrypted backups to.
    // Synced, and kept in backups and exports.
    repeated BackupDestination BackupDestinations = 15;
}

//#region BackupDestinations
message BackupDestination {
    // ULID, also the folder the vault's backups go under.
    string ID = 1;
    string Name = 2;
    // Origin of the S3 API, such as "https://s3.eu-central-1.amazonaws.com".
    string Endpoint = 3;
    string Region = 4;
    string Bucket = 5;
    // Empty, or a key prefix ending in "/".
    string Prefix = 6;
    // Address the bucket as <endpoint>/<bucket> instead of <bucket>.<host>.
    bool PathStyle = 7;
    string AccessKeyID = 8;
    string SecretAccessKey = 9;
    // Devices never delete their backups here, for keys without delete
    // rights. Otherwise each device thins its own backups by age.
    bool KeepAll = 10;
    // Paused destinations get no uploads from any device.
    bool Paused = 11;
    int64 CreatedAtTimestamp = 12;

    string Hash = 13;
    int32 Version = 14;
    int64 DateModifiedTimestamp = 15;
    bool Deleted = 16;
}
//#endregion BackupDestinations

//#region ConnectedAgents
// A Linux machine running cryptex-agent. It holds no private keys and asks
// its approver (the device that paired it) to sign with granted SSH key
// items. Synced so every linked device lists the agent and can revoke it;
// only the approver answers its requests. See agent.proto for the protocol.
message ConnectedAgent {
    // Unpadded base64url of AgentSignPublicKey.
    string ID = 1;
    // Chosen by the user when pairing.
    string Name = 2;
    // The agent's Ed25519 relay key and X-Wing encryption key.
    bytes AgentSignPublicKey = 3;
    bytes AgentKEMPublicKey = 4;
    // From the pairing offer; reported by the machine, so unverified.
    string Hostname = 5;
    string OS = 6;
    string Arch = 7;
    string AgentVersion = 8;
    // The approving device's relay keys and name. A device recognizes
    // itself as the approver by its own relay key.
    bytes ApproverSignPublicKey = 9;
    bytes ApproverKEMPublicKey = 10;
    string ApproverName = 11;
    // Ed25519 seed of the key registered for POST /v1/revoke, so any linked
    // device can revoke the agent.
    bytes RevocationSeed = 12;
    // Relay URL, such as "https://relay.example.com" or, behind a path,
    // "https://example.com/relay"; empty for the hosted relay (Online
    // Services). Fixed at pairing: merges keep the first value.
    string RelayOrigin = 13;
    // SSH key items (Credential IDs) the agent may use, in the order offered.
    repeated string CredentialIDs = 14;
    uint64 KeysRevision = 15;
    int64 PairedAtTimestamp = 16;
    int64 LastUsedTimestamp = 17;
    // Newest first, at most 90 days and 200 entries.
    repeated AgentRequestRecord History = 18;

    string Hash = 19;
    int32 Version = 20;
    int64 DateModifiedTimestamp = 21;
    bool Deleted = 22;
    // Server names the user approved per host key, so the approval screen can
    // warn when a known host key comes under a new name or a known name with
    // a new host key. Written only when the user approves a request. Merges
    // take the union; at most 100, oldest dropped.
    repeated AgentKnownHost KnownHosts = 23;
    // Paused agents get every request refused without asking. Any device can
    // pause or resume.
    bool Paused = 24;
}

message AgentKnownHost {
    // SHA256 fingerprint of the verified server host key.
    string Fingerprint = 1;
    // The name the machine reported for it (its known_hosts).
    string Name = 2;
    int64 FirstSeenTimestamp = 3;
}

enum AgentRequestKind {
    AgentRequestUnknown = 0;
    // An SSH login (userauth).
    AgentRequestLogin = 1;
    // An SSHSIG signature (git commits, ssh-keygen -Y sign); see Namespace.
    AgentRequestSignature = 2;
    // Anything else.
    AgentRequestOther = 3;
}

enum AgentRequestOutcome {
    AgentOutcomeUnknown = 0;
    AgentOutcomeApproved = 1;
    // Approved by a remembered rule without asking.
    AgentOutcomeApprovedByRule = 2;
    AgentOutcomeDenied = 3;
    // Nobody answered before the request expired.
    AgentOutcomeExpired = 4;
    // Refused by a check (invalid data, key no longer granted).
    AgentOutcomeRefused = 5;
}

message AgentRequestRecord {
    int64 Timestamp = 1;
    AgentRequestKind Kind = 2;
    AgentRequestOutcome Outcome = 3;
    // SSHSIG namespace, such as "git".
    string Namespace = 4;
    // Server name as reported by the machine's known_hosts, if any.
    string Host = 5;
    // SHA256 fingerprint of the verified server host key, if any.
    string HostKeyFingerprint = 6;
    bool Forwarded = 7;
    bool DestinationUnknown = 8;
    // The SSH key item used.
    string CredentialID = 9;
    // The calling program as reported by the machine, such as "git push".
    string Process = 10;
}
// Device-local state of this device's approver (the web dashboard keeps it
// in the vault; Android keeps it in secure storage instead).
message AgentApproverSettings {
    // Seeds of the approver identity: Ed25519 relay key and X-Wing
    // encryption key, 32 bytes each. Agents pin their public halves.
    bytes SignSeed = 1;
    bytes KEMSeed = 2;
    // Self-hosted relays (token mode) this device uses.
    repeated AgentRelaySettings CustomRelays = 3;
    // The hosted relay pass last issued for SignSeed's public key.
    string RelayPass = 4;
    int64 RelayPassExpiresAt = 5;
    // Agents this device paired and the keys it last sent each one. The
    // approver serves only these, and only keys both here and in the synced
    // record, so a synced record alone can't add an agent or a grant.
    repeated AgentLocalApproval ApprovedAgents = 6;
}

message AgentLocalApproval {
    // ConnectedAgent.ID
    string AgentID = 1;
    // SSH wire public keys this device sent the agent.
    repeated bytes Keys = 2;
}

message AgentRelaySettings {
    // Normalized relay URL, such as "https://relay.example.com" or
    // "https://example.com/relay".
    string Origin = 1;
    // The relay's access token.
    string Token = 2;
}
//#endregion ConnectedAgents

//#region ShareLinks
message ShareLink {
    // Server-assigned share ID (the <id> in /s/<id>)
    string ID = 1;
    // Origin serving /s/<id> and /share-api
    string ServerOrigin = 2;
    // Base64url token that proves ownership for status and revoke
    string ManageToken = 3;
    // Shared vault item, empty for free text
    string CredentialID = 4;
    string Label = 5;
    int64 CreatedAtTimestamp = 6;
    int64 ExpiresAtTimestamp = 7;
    bool Passphrase = 8;
    // Last status reported by the server ("active", "viewed", ...)
    string Status = 9;
    int64 ViewedAtTimestamp = 10;

    string Hash = 11;
    int32 Version = 12;
    int64 DateModifiedTimestamp = 13;
    bool Deleted = 14;
}

message ShareSettings {
    // Empty means the Online Services share server
    string ServerOrigin = 1;
    // Creation token for a self-hosted share server
    string CreationToken = 2;
}
//#endregion ShareLinks

//#region OnlineServices
message OnlineServices {
    string DeviceId = 1;
    string UserID = 2;
    string PrivateKeyJWK = 3;
    string PublicKeyJWK = 4;
}
//#endregion OnlineServices

//#region LinkedDevices
message STUNServerConfiguration {
    int32 Version = 1;
    string ID = 2;
    string Name = 3;
    string Host = 4;
}

message TURNServerConfiguration {
    int32 Version = 1;
    string ID = 2;
    string Name = 3;
    string Host = 4;
    string Username = 5;
    string Password = 6;
}

message SignalingServerConfiguration {
    int32 Version = 1;
    string ID = 2;
    string Name = 3;
    string AppID = 4;
    string Key = 5;
    string Secret = 6;
    string Host = 7;
    string ServicePort = 8;
    string SecureServicePort = 9;
}

message LinkedDevices {
    reserved 1; reserved "ID";
    reserved 2; reserved "APIKey";
    reserved 3; reserved "CreationTimestamp";

    reserved 4;
    repeated LinkedDevice Devices = 5;
    repeated STUNServerConfiguration STUNServers = 6;
    repeated TURNServerConfiguration TURNServers = 7;
    repeated SignalingServerConfiguration SignalingServers = 8;

    /** ML-DSA-65 keypair for signing sync envelopes (one per vault installation). */
    string SyncSigningPublicKey = 9;
    string SyncSigningPrivateKey = 10;

    /** ML-KEM-768 keypair for encrypting sync/link sessions (one per vault installation). */
    string SyncKemPublicKey = 11;
    string SyncKemPrivateKey = 12;

    /** Names this installation's folder in backup destinations. Never synced or backed up. */
    string BackupDeviceID = 13;
    /** Keys the local marker of what this installation last backed up. */
    string BackupMarkerKey = 14;
}

message LinkedDevice {
    string ID = 1;
    string Name = 2;
    optional string LastSync = 3;
    reserved 4; reserved "IsRoot";
    int64 LinkedAtTimestamp = 5;
    bool AutoConnect = 6;
    bool SyncTimeout = 7;
    int32 SyncTimeoutPeriod = 8;

    /**
     * Both devices use this ID when exchanging messages during the sync process.
     * It is server-minted when the devices use Online Services.
     * It is client-minted when the devices use third-party signaling servers.
     */
    string SyncID = 12;

    /**
      * The ID of the STUN server to use for this device.
      * @default Empty list - The Cryptex Vault Online Service STUN server will be used.
      */
    repeated string STUNServerIDs = 9;
    /**
      * The ID of the TURN server to use for this device.
      * @default Empty list - The Cryptex Vault Online Service TURN server will be used.
      */
    repeated string TURNServerIDs = 10;
    /**
      * The ID of the Signaling server to use for this device.
      * @default "OnlineServices" - The Cryptex Vault Online Service Signaling server will be used.
      */
    string SignalingServerID = 11;

    /** Remote peer sync-signing public key, exchanged during linking. */
    string RemoteSyncPublicKey = 13;

    /** Remote peer ML-KEM public key, exchanged during linking. */
    string RemoteSyncKemPublicKey = 14;

    /** Automatically synchronize when the WebRTC data channel opens. */
    bool AutoSync = 15;
}
//#endregion LinkedDevices

//#region Credentials
message VersionVector {
    string ID = 1;
    string Hash = 2;
    int32 Version = 3;
    int64 DateModifiedTimestamp = 4;
    bool Deleted = 5;
}

message Directory {
    string ID = 1;
    string Name = 2;
    int32 Version = 3;
    string Hash = 4;
    int64 DateModifiedTimestamp = 5;
    bool Deleted = 6;
}

enum CredentialURLMatchMode {
    ExactHost = 0;
    Domain = 1;
    Wildcard = 2;
}

message CredentialURL {
    string URL = 1;
    CredentialURLMatchMode MatchMode = 2;
}

// WebAuthn passkey material. Secret key material remains inside the encrypted
// vault and must never be projected into list/search responses.
message PasskeyData {
    string CredentialID = 1;
    string RPID = 2;
    string RPName = 3;
    string UserHandle = 4;
    string UserName = 5;
    string UserDisplayName = 6;
    string PublicKey = 7;
    string PrivateKey = 8;
    int32 Algorithm = 9;
    uint32 SignCount = 10;
    bool Discoverable = 11;
}

// SSH key material. The private key is an unencrypted OpenSSH private key; the
// vault's own encryption protects it. Algorithm, size and fingerprint are
// derived from PublicKey when needed.
message SSHKeyData {
    string PrivateKey = 1;
    // "<algorithm> <base64 blob>", without the comment.
    string PublicKey = 2;
    string Comment = 3;
}

message Credential {
    string ID = 1;
    ItemType Type = 2;
    reserved 3; reserved "GroupID";
    string Name = 4;
    string Username = 5;
    string Password = 6;
    optional TOTP TOTP = 7;
    optional string Tags = 8;
    string URL = 9;
    string Notes = 10;

    // NOTE: These fields are deprecated and can be removed after August 2026
    string DateCreated = 11 [deprecated = true];
    optional string DateModified = 12 [deprecated = true];
    optional string DatePasswordChanged = 13 [deprecated = true];

    repeated CustomField CustomFields = 14;
    string Hash = 15;
    int32 Version = 16;

    int64 DateCreatedTimestamp = 17;
    int64 DateModifiedTimestamp = 18;
    int64 DatePasswordChangedTimestamp = 19;

    bool Deleted = 20;
    string DirectoryID = 21;
    CredentialURLMatchMode URLMatchMode = 22;
    repeated CredentialURL AdditionalURLs = 23;
    optional PasskeyData Passkey = 24;
    optional SSHKeyData SSHKey = 25;
}

message TOTP {
    string Label = 1;
    string Secret = 3;
    int32 Period = 4;
    int32 Digits = 5;
    TOTPAlgorithm Algorithm = 6;
}

enum TOTPAlgorithm {
    SHA1 = 0;
    SHA256 = 1;
    SHA512 = 2;
}
//#endregion Credentials

//#region Synchronization Message
message SyncKeyBundle {
    string SyncSigningPublicKey = 1;
    string SyncKemPublicKey = 2;
}

enum VaultItemSynchronizationMessageCommand {
    SyncHello = 0;
    SyncHelloEcho = 1;
    SyncDataRequest = 2;
    SyncDataResponse = 3;
}

enum SyncWireMessageCommand {
    SyncSessionInit = 0;
    SyncSessionAccept = 1;
    SyncEncryptedMessage = 2;
}

message SyncPlaintextMessage {
    string ID = 1;
    VaultItemSynchronizationMessageCommand Command = 2;
    bytes Payload = 3;
}

message SynchronizationEnvelope {
    string ID = 1;
    SyncWireMessageCommand Command = 2;
    int32 ProtocolVersion = 3;
    string SessionID = 4;
    int64 Sequence = 5;
    bytes Nonce = 6;
    bytes Ciphertext = 7;
    bytes KemCiphertext = 8;
    bytes HandshakeSignature = 9;
}

message SyncHelloMessage {
    repeated VersionVector CredentialVersionVectors = 1;
    repeated VersionVector DirectoryVersionVectors = 2;
    repeated VersionVector ShareLinkVersionVectors = 3;
    repeated VersionVector ConnectedAgentVersionVectors = 4;
    repeated VersionVector BackupDestinationVersionVectors = 5;
}

message SyncHelloEchoMessage {
    repeated VersionVector CredentialVersionVectors = 1;
    repeated VersionVector DirectoryVersionVectors = 2;
    repeated VersionVector ShareLinkVersionVectors = 3;
    repeated VersionVector ConnectedAgentVersionVectors = 4;
    repeated VersionVector BackupDestinationVersionVectors = 5;
}

enum SyncItemType {
    CredentialItem = 0;
    DirectoryItem = 1;
    ShareLinkItem = 2;
    ConnectedAgentItem = 3;
    BackupDestinationItem = 4;
}

message SyncItemReference {
    SyncItemType Type = 1;
    string ID = 2;
}

message SyncDataRequestMessage {
    repeated SyncItemReference Items = 1;
}

message SyncDataResponseMessage {
    repeated Credential Credentials = 1;
    repeated Directory Directories = 2;
    repeated ShareLink ShareLinks = 3;
    repeated ConnectedAgent ConnectedAgents = 4;
    repeated BackupDestination BackupDestinations = 5;
}
//#endregion Synchronization Message

//#region Linking
message LinkingPackageBlob {
    string SyncID = 1;
    OnlineServices OnlineServices = 2;
    repeated STUNServerConfiguration STUNServers = 3;
    repeated TURNServerConfiguration TURNServers = 4;
    SignalingServerConfiguration SignalingServer = 5;

    /** Sender vault installation sync authentication/encryption public keys. */
    SyncKeyBundle SenderKeyBundle = 6;
}

message LinkSenderHello {
    bytes Nonce = 1;
    bytes Mac = 2;
}

message LinkReceiverKeyBundle {
    SyncKeyBundle ReceiverKeyBundle = 1;
    bytes Nonce = 2;
    bytes Mac = 3;
}

message LinkVaultTransfer {
    bytes KemCiphertext = 1;
    bytes Nonce = 2;
    bytes Ciphertext = 3;

    /** ML-DSA-65 signature over linkVaultTransferContext for this transfer. */
    bytes HandshakeSignature = 4;
}

message LinkingPackage {
    // Byte array of the package blob
    bytes Blob = 1;

    // Encryption - Salt
    string Salt = 2;

    // Encryption - Header IV
    string HeaderIV = 3;
}
//#endregion Linking
