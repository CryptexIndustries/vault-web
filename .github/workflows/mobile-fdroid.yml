name: Mobile F-Droid

on:
  workflow_call:
    inputs:
      profile:
        description: production for releases; preprod builds the same recipe as com.cryptexindustries.vault.preprod
        type: string
        default: production
      abis:
        description: JSON list of the ABIs to build
        type: string
        default: '["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]'

permissions:
  contents: read

concurrency:
  group: mobile-fdroid-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: ${{ inputs.profile == 'preprod' && 'Mobile - Preproduction' || 'Mobile - Production' }}
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(inputs.abis) }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Make room for the Android build
        run: sudo rm -rf /usr/local/lib/android/sdk /usr/share/dotnet

      - name: Build and scan the complete F-Droid recipe
        env:
          RELEASE_REF: ${{ github.ref }}
          CRYPTEX_APP_PROFILE: ${{ inputs.profile }}
          CRYPTEX_BUILD_ARCH: ${{ matrix.abi }}
        run: |
          test -z "$(git status --porcelain)"
          mkdir "$RUNNER_TEMP/fdroid"
          # The tag fdroiddata's own "fdroid build" job uses. GitLab deletes
          # superseded digests, so a digest pin breaks once F-Droid rebuilds
          # it; the log records which image built this run.
          image=registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
          docker pull --quiet "$image"
          echo "F-Droid build image: $(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/app,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/fdroid,target=/build" \
            --env "SOURCE_COMMIT=$(git rev-parse HEAD)" \
            --env RELEASE_REF \
            --env CRYPTEX_APP_PROFILE \
            --env CRYPTEX_BUILD_ARCH \
            --entrypoint /bin/bash \
            "$image" \
            /app/mobile/fdroid/ci.sh

      - name: Upload unsigned APK and its configuration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-fdroid-unsigned-${{ github.run_id }}-${{ matrix.abi }}
          path: ${{ runner.temp }}/fdroid/artifacts/
          if-no-files-found: error

      - name: Upload submission metadata and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-fdroid-submission-${{ github.run_id }}-${{ matrix.abi }}
          path: |
            ${{ runner.temp }}/fdroid/submission/metadata/
            ${{ runner.temp }}/fdroid/submission/srclibs/
            ${{ runner.temp }}/fdroid/fdroid/build.log
            ${{ runner.temp }}/fdroid/fdroid/logs/
            ${{ runner.temp }}/fdroid/fdroid/repo/status/
          if-no-files-found: error
