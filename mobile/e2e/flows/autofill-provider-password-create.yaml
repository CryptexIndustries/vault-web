appId: com.cryptex.autofillfixture
name: Credential Manager password creation
---
# Prerequisite: Cryptex Vault is enabled as an Android credential provider.
- launchApp
- tapOn: Credential Manager passwords
- tapOn: Create password credential
- runFlow:
    when:
      visible: ${CRYPTEX_APP_NAME}
    commands:
      - tapOn: ${CRYPTEX_APP_NAME}
- runFlow:
    when:
      visible: Save password to sign in to Autofill Test App?
    commands:
      - assertVisible: cm-native@example.test
      - tapOn: Continue
- runFlow:
    when:
      visible: Master password
    commands:
      - tapOn: Master password
      - inputText: CorrectHorseBatteryStaple42
      - hideKeyboard
      - tapOn:
          id: unlock-vault
- assertVisible: Add item
- assertVisible: cm-native@example.test
- assertVisible: androidapp://com.cryptex.autofillfixture
- tapOn:
    id: credential-submit
- assertVisible: Credential Manager create complete
