appId: ${CRYPTEX_APP_ID}
name: Create a real device-link invitation
---
- runFlow: setup-vault.yaml
- runFlow: setup-transfer-item.yaml
- runFlow: sync-disable-auto-lock.yaml
- runFlow: setup-sync-connectivity.yaml
- tapOn: Link a device
- tapOn: Create invitation,.*
- tapOn: Receiving device name
- eraseText: 20
- inputText: E2E Receiver
- hideKeyboard
- tapOn: Create invitation
- scrollUntilVisible:
      element:
          text: Copy invitation
      direction: DOWN
# The live transfer is already waiting; sharing must not stop it.
- tapOn: Share file
- runFlow: export-capture.yaml
# The words sit just above Share file; read them before scrolling further down.
- scrollUntilVisible:
      element:
          text: "[a-z]+( [a-z]+){11}"
      direction: UP
- copyTextFrom: "[a-z]+( [a-z]+){11}"
- evalScript: ${console.log('E2E_TRANSFER_PHRASE:' + maestro.copiedText)}
- scrollUntilVisible:
      element:
          text: Waiting for other device.*
      direction: DOWN
