appId: ${CRYPTEX_APP_ID}
name: A password change with key rotation replaces this device's backups
---
- launchApp:
      stopApp: false
- tapOn: More
- tapOn: Security,.*
- tapOn: Master password,.*
- tapOn: Current master password
- inputText: CorrectHorseBatteryStaple42
- tapOn: New master password
- inputText: GarageRotatedPassword77
- tapOn: Confirm new master password
- inputText: GarageRotatedPassword77
- hideKeyboard
- scrollUntilVisible:
      element:
          text: Delete older destination backups after replacement
      direction: DOWN
- tapOn: Rotate this device's vault encryption key
- tapOn: Delete older destination backups after replacement
- scrollUntilVisible:
      element:
          text: Change password
      direction: DOWN
- tapOn: Change password
- extendedWaitUntil:
      visible: I saved my new vault recovery code.
      timeout: 60000
- tapOn: I saved my new vault recovery code.
- tapOn: Finish
- extendedWaitUntil:
      visible: Security settings and vault encryption key updated.*
      timeout: 10000
- tapOn: Back
- tapOn: Back
- tapOn:
      text: Vault
      below: Security,.*
- assertVisible: Search your vault
