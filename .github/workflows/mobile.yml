name: Mobile

on:
  push:
    branches: [development, master]
    tags: ["mobile-v*"]
    paths:
      - "mobile/**"
      - "packages/vault-core/**"
      - "packages/api-contract/**"
      - "packages/shared-ui/**"
      - "e2e/**"
      - "compose.e2e.yaml"
      - "patches/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/mobile.yml"
      - ".github/workflows/mobile-fdroid.yml"
      - "!**/*.md"
      - "!mobile/store-listing/**"
      - "!mobile/*.webm"
  pull_request:
    paths:
      - "mobile/**"
      - "packages/vault-core/**"
      - "packages/api-contract/**"
      - "packages/shared-ui/**"
      - "e2e/**"
      - "compose.e2e.yaml"
      - "patches/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/mobile.yml"
      - ".github/workflows/mobile-fdroid.yml"
      - "!**/*.md"
      - "!mobile/store-listing/**"
      - "!mobile/*.webm"
  workflow_dispatch:
    inputs:
      profile:
        description: Preproduction builds the selected branch; production requires a mobile-v tag
        required: true
        default: preprod
        type: choice
        options: [preprod, production]
      distribution:
        description: Preproduction only; fdroid builds arm64-v8a and x86_64 with the F-Droid recipe instead of the standard APK
        required: true
        default: standard
        type: choice
        options: [standard, fdroid]

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.profile || 'checks' }}-${{ inputs.distribution || 'standard' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

permissions:
  contents: read

jobs:
  check:
    name: lint / typecheck / unit tests / CLI tests / android JS export
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate release selection
        env:
          RELEASE_PROFILE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mobile-v') && 'production' || inputs.profile || 'preprod' }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { getProfile } from './mobile/scripts/release-config.mjs';
          getProfile(process.env.RELEASE_PROFILE);
          if (process.env.RELEASE_PROFILE === 'production') {
            const app = JSON.parse(readFileSync('mobile/app.json', 'utf8')).expo;
            assert.equal(process.env.GITHUB_REF_TYPE, 'tag', 'Run production on a mobile-v release tag.');
            assert.equal(process.env.GITHUB_REF_NAME, `mobile-v${app.version}`, 'Release tag must match the application version.');
          }
          NODE

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check mobile
        run: pnpm mobile:check

  smoke:
    name: android e2e smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mobile-v'))
    env:
      MAESTRO_CLI_NO_ANALYTICS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Android build tools
        run: |
          test -n "$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses < <(printf 'y\n%.0s' {1..100})
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "build-tools;34.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install verified Maestro 2.9.0
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.9.0/maestro.zip"
          printf '%s  %s\n' \
            '855bb2ce1399d82f4f4a73d84a4d945f70b0d43eb86127e027af82809f63f0bd' \
            "$RUNNER_TEMP/maestro.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/maestro/bin/maestro" --version)" = "2.9.0"

      - name: Verify pinned native build reproducibility fixtures
        run: CRYPTEX_NATIVE_TEST_SDK="$ANDROID_SDK_ROOT" pnpm mobile:check -- cli

      - name: Build test-only E2E APK
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8"'
          ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
          EXPO_PUBLIC_CLOUD_ENABLED: "false"
          EXPO_PUBLIC_APP_URL: "http://10.0.2.2:43110"
          EXPO_PUBLIC_ONLINE_SERVICES_API_URL: "http://10.0.2.2:43110"
        run: pnpm mobile:build -- --e2e

      - name: Verify Android QR scanner
        # The native QR decoder tests use synthetic production-sized frames.
        # Physical camera performance remains a device acceptance check.
        run: pnpm mobile:e2e -- qr

      - name: Stop Gradle before emulator
        run: mobile/android/gradlew --stop

      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke flow on emulator
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            test "$(adb devices | awk '$2 == "device" { count++ } END { print count+0 }')" = 1
            test -n "$ANDROID_SERIAL"
            adb -s "$ANDROID_SERIAL" shell settings put secure show_ime_with_hard_keyboard 1
            adb -s "$ANDROID_SERIAL" install -r -t mobile/android/app/build/outputs/apk/e2e/app-e2e.apk
            pnpm mobile:e2e -- smoke
            pnpm mobile:e2e -- crypto
            pnpm mobile:e2e -- native
            # Starts its own Garage in Docker.
            pnpm mobile:e2e -- backup-destinations

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-e2e-smoke
          path: |
            mobile/e2e/results
            ~/.maestro/tests
          if-no-files-found: ignore

  preprod_build:
    name: build preproduction APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: [check, smoke]
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'preprod' && inputs.distribution != 'fdroid'
    environment: Mobile - Preproduction
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Android build tools
        run: |
          test -n "$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses < <(printf 'y\n%.0s' {1..100})
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" "build-tools;36.0.0" "build-tools;34.0.0" \
            "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build unsigned preproduction APK
        run: pnpm mobile:build -- --unsigned --profile preprod --config mobile/prerelease-config.json --clean --jobs 4 --heap 4096

      - name: Prepare signing inputs
        run: |
          mkdir "$RUNNER_TEMP/mobile-release"
          cp mobile/dist/cryptex-vault-preprod-unsigned.apk{,.json} "$RUNNER_TEMP/mobile-release/"
          cp mobile/prerelease-config.json "$RUNNER_TEMP/mobile-release/release-config.json"

      - name: Upload verified unsigned APK and its configuration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-preprod-unsigned-${{ github.run_id }}
          path: ${{ runner.temp }}/mobile-release/
          if-no-files-found: error

  preprod_sign:
    name: sign preproduction APK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: preprod_build
    environment: Mobile - Preproduction
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned APK inspection and signing tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "build-tools;36.0.0" "build-tools;34.0.0"

      - name: Download verified unsigned APK and its configuration
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mobile-preprod-unsigned-${{ github.run_id }}
          path: ${{ runner.temp }}/mobile-release

      - name: Sign and verify the preproduction APK
        env:
          CRYPTEX_KEYSTORE_BASE64: ${{ secrets.CRYPTEX_KEYSTORE_BASE64 }}
          CRYPTEX_KEYSTORE_PASSWORD: ${{ secrets.CRYPTEX_KEYSTORE_PASSWORD }}
          CRYPTEX_KEY_PASSWORD: ${{ secrets.CRYPTEX_KEY_PASSWORD }}
        run: node mobile/scripts/ci-release.mjs sign preprod "$RUNNER_TEMP/mobile-release"

      - name: Upload signed preproduction APK, configuration and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-preprod-release-${{ github.run_id }}
          path: ${{ runner.temp }}/mobile-release/
          if-no-files-found: error

  fdroid:
    name: build F-Droid APKs
    needs: check
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mobile-v')) || (github.event_name == 'workflow_dispatch' && (inputs.profile == 'production' || inputs.distribution == 'fdroid'))
    uses: ./.github/workflows/mobile-fdroid.yml
    with:
      profile: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'preprod' && 'preprod' || 'production' }}
      abis: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'preprod' && '["arm64-v8a", "x86_64"]' || '["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]' }}

  fdroid_sign:
    name: sign production F-Droid APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [fdroid, smoke]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mobile-v')) || (github.event_name == 'workflow_dispatch' && inputs.profile == 'production')
    environment: Mobile - Production
    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned APK inspection and signing tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "build-tools;36.0.0" "build-tools;34.0.0"

      - name: Download verified unsigned APKs and their configuration
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mobile-fdroid-unsigned-${{ github.run_id }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/mobile-release

      - name: Sign and verify the production APKs
        env:
          CRYPTEX_KEYSTORE_BASE64: ${{ secrets.CRYPTEX_KEYSTORE_BASE64 }}
          CRYPTEX_KEYSTORE_PASSWORD: ${{ secrets.CRYPTEX_KEYSTORE_PASSWORD }}
          CRYPTEX_KEY_PASSWORD: ${{ secrets.CRYPTEX_KEY_PASSWORD }}
        run: node mobile/scripts/ci-release.mjs sign production "$RUNNER_TEMP/mobile-release"

      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test signed production APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb -s "$ANDROID_SERIAL" install "$RUNNER_TEMP/mobile-release/$(node --input-type=module -e 'import { artifactName } from "./mobile/scripts/release-config.mjs"; console.log(artifactName({ distribution: "fdroid", arch: "x86_64" }));')"
            adb -s "$ANDROID_SERIAL" shell am start -W -n com.cryptexindustries.vault/.MainActivity
            sleep 10
            adb -s "$ANDROID_SERIAL" logcat -d -b crash -v brief
            adb -s "$ANDROID_SERIAL" shell pidof com.cryptexindustries.vault

      - name: Upload signed F-Droid APKs, configuration and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-fdroid-release-${{ github.run_id }}
          path: ${{ runner.temp }}/mobile-release/
          if-no-files-found: error

  fdroid_release:
    name: draft GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: fdroid_sign
    # mobile-v1.2.3 tags open a draft release with the 1.2.3 section of
    # mobile/CHANGELOG.md and the signed APKs. Publishing it is a manual step.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mobile-v')
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0

      - name: Download signed F-Droid APKs and their configuration
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mobile-fdroid-release-${{ github.run_id }}
          path: ${{ runner.temp }}/mobile-release

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#mobile-v}"
          # One signed APK per architecture, named after its version code.
          node --input-type=module -e '
            import { artifactName } from "./mobile/scripts/release-config.mjs";
            const devices = {
              "arm64-v8a": "Most Android phones, ARM64",
              "armeabi-v7a": "Older 32-bit ARM devices",
              x86: "32-bit Intel devices",
              x86_64: "64-bit Intel devices",
            };
            for (const [arch, device] of Object.entries(devices))
              console.log(`${device}\t${artifactName({ distribution: "fdroid", arch })}`);
          ' > "$RUNNER_TEMP/apks.tsv"
          assets=() downloads=""
          while IFS=$'\t' read -r device apk; do
            assets+=("$apk" "$apk.json")
            downloads+="- ${device}: \`${apk}\`"$'\n'
          done < "$RUNNER_TEMP/apks.tsv"
          assets+=(release-config.json)
          cd "$RUNNER_TEMP/mobile-release"
          # The signing step's SHA256SUMS also lists the unsigned APKs, which
          # aren't published.
          sha256sum -- "${assets[@]}" > SHA256SUMS
          export RELEASE_INTRO="Download the APK for your device to install Cryptex Vault ${version} on Android.

          ${downloads}
          New in ${version}:"
          export RELEASE_OUTRO="The APKs are signed with the Cryptex Vault production key. Each APK's JSON file records its source commit and signing certificate. Checksums are in \`SHA256SUMS\`."
          "$GITHUB_WORKSPACE/scripts/draft-release.sh" "Android ${version}" "$GITHUB_WORKSPACE/mobile/CHANGELOG.md" "${assets[@]}" SHA256SUMS

  fdroid_preprod_sign:
    name: sign preproduction F-Droid APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [fdroid, smoke]
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'preprod' && inputs.distribution == 'fdroid'
    environment: Mobile - Preproduction
    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned APK inspection and signing tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "build-tools;36.0.0" "build-tools;34.0.0"

      - name: Download verified unsigned APKs and their configuration
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mobile-fdroid-unsigned-${{ github.run_id }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/mobile-release

      - name: Sign and verify the preproduction APKs
        env:
          CRYPTEX_KEYSTORE_BASE64: ${{ secrets.CRYPTEX_KEYSTORE_BASE64 }}
          CRYPTEX_KEYSTORE_PASSWORD: ${{ secrets.CRYPTEX_KEYSTORE_PASSWORD }}
          CRYPTEX_KEY_PASSWORD: ${{ secrets.CRYPTEX_KEY_PASSWORD }}
        run: node mobile/scripts/ci-release.mjs sign preprod "$RUNNER_TEMP/mobile-release" fdroid

      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test signed preproduction APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb -s "$ANDROID_SERIAL" install "$RUNNER_TEMP/mobile-release/$(node --input-type=module -e 'import { artifactName } from "./mobile/scripts/release-config.mjs"; console.log(artifactName({ profile: "preprod", distribution: "fdroid", arch: "x86_64" }));')"
            adb -s "$ANDROID_SERIAL" shell am start -W -n com.cryptexindustries.vault.preprod/.MainActivity
            sleep 10
            adb -s "$ANDROID_SERIAL" logcat -d -b crash -v brief
            adb -s "$ANDROID_SERIAL" shell pidof com.cryptexindustries.vault.preprod

      - name: Upload signed F-Droid APKs, configuration and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-fdroid-preprod-release-${{ github.run_id }}
          path: ${{ runner.temp }}/mobile-release/
          if-no-files-found: error
