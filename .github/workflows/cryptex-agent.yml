name: cryptex-agent

# cryptex-agent-v1.2.3 tags build the Linux tarballs and a draft GitHub release
# "cryptex-agent 1.2.3". Publishing the draft is a manual step, and the AUR job
# runs when it is published (disabled until the AUR package exists).
on:
    push:
        tags: ["cryptex-agent-v*"]
    release:
        types: [published]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
    cancel-in-progress: false

jobs:
    tarballs:
        name: Build ${{ matrix.arch }} tarball
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        container:
            image: golang:1.26@sha256:3745f1aa11822297b79113f5e84ce2bffeb039734571c39855809cfe9e5d7be6
        strategy:
            matrix:
                arch: [amd64, arm64]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Check the tag
              id: version
              shell: bash
              run: |
                  version="${GITHUB_REF_NAME#cryptex-agent-v}"
                  if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
                    echo "Release tags look like cryptex-agent-v1.2.3 or cryptex-agent-v1.2.3-rc1, not ${GITHUB_REF_NAME}" >&2
                    exit 1
                  fi
                  echo "version=${version}" >> "$GITHUB_OUTPUT"
            # The CI workflow runs the full suite on the same tag; this keeps a
            # failing or vulnerable build from producing release files.
            - name: Test and audit
              working-directory: services
              run: |
                  apt-get update -qq && apt-get install -y -qq --no-install-recommends openssh-server
                  go vet ./...
                  go test ./...
                  go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
            # actions/checkout only trusts the workspace during its own step, and
            # this container runs as root over a runner-owned checkout. go build
            # needs git to stamp the commit into the binary.
            - name: Trust the checkout
              run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
            - name: Build tarball
              run: services/cmd/cryptex-agent/package.sh "${{ steps.version.outputs.version }}" "${{ matrix.arch }}" "${RUNNER_TEMP}/dist"
            # archive: false keeps GitHub from wrapping the tarball in a ZIP. The
            # artifact is named after the file.
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  path: ${{ runner.temp }}/dist/*.tar.gz
                  archive: false
                  if-no-files-found: error

    draft-release:
        name: Draft GitHub release
        needs: [tarballs]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: cryptex-agent-*
                  merge-multiple: true
                  path: dist
            - name: Create draft release
              working-directory: dist
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  version="${GITHUB_REF_NAME#cryptex-agent-v}"
                  sha256sum -- *.tar.gz > sha256sums.txt
                  prerelease=()
                  if [[ "${version}" == *-* ]]; then prerelease=(--prerelease); fi
                  gh release create "${GITHUB_REF_NAME}" \
                    --repo "${GITHUB_REPOSITORY}" \
                    --draft "${prerelease[@]}" \
                    --verify-tag \
                    --title "cryptex-agent ${version}" \
                    --notes "Keyless SSH agent for Linux. Static binaries for amd64 and arm64 with a systemd user unit. See README.md in the tarball to set it up." \
                    -- *.tar.gz sha256sums.txt

    aur:
        name: Publish to the AUR
        # Disabled until the cryptex-agent-bin AUR package exists. To turn it on,
        # create an "aur" environment with required reviewers, add an
        # AUR_SSH_PRIVATE_KEY secret to it whose public key is on the AUR
        # account, then replace this line with:
        # if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'cryptex-agent-v') && !github.event.release.prerelease
        if: ${{ false }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # Holds AUR_SSH_PRIVATE_KEY. Give the environment required reviewers so
        # publishing a release alone can't push to the AUR.
        environment: aur
        container:
            image: archlinux:base@sha256:3c64b538588416593f69a1aebd2f2ec0f2541b29159f32556fa7def2167147a0
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.release.tag_name }}
            - name: Install tools
              run: pacman -Syu --noconfirm --needed git openssh base-devel
            - name: Fill in the PKGBUILD
              shell: bash
              env:
                  GH_REPO: ${{ github.repository }}
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  version="${TAG#cryptex-agent-v}"
                  # The version goes into sed and the PKGBUILD, which makepkg
                  # sources as shell. pacman versions can't contain "-" either.
                  if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "AUR releases need a final version like cryptex-agent-v1.2.3, not ${TAG}" >&2
                    exit 1
                  fi
                  base="https://github.com/${GH_REPO}/releases/download/${TAG}"
                  curl -fsSL "${base}/sha256sums.txt" -o sha256sums.txt
                  sum() { awk -v f="cryptex-agent-${version}-linux-$1.tar.gz" '$2 == f { print $1 }' sha256sums.txt; }
                  amd64="$(sum amd64)" arm64="$(sum arm64)"
                  test -n "${amd64}" && test -n "${arm64}"
                  mkdir -p "${RUNNER_TEMP}/pkg"
                  sed -e "s/^pkgver=.*/pkgver=${version}/" \
                      -e "s/^pkgrel=.*/pkgrel=1/" \
                      -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${amd64}')/" \
                      -e "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${arm64}')/" \
                      services/cmd/cryptex-agent/aur/PKGBUILD > "${RUNNER_TEMP}/pkg/PKGBUILD"
                  # makepkg refuses to run as root.
                  useradd -m builder
                  chown -R builder "${RUNNER_TEMP}/pkg"
                  su builder -c "cd '${RUNNER_TEMP}/pkg' && makepkg --printsrcinfo > .SRCINFO"
            - name: Push to the AUR
              shell: bash
              env:
                  AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  install -d -m 700 ~/.ssh
                  printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > ~/.ssh/aur
                  chmod 600 ~/.ssh/aur
                  # Fingerprint SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4, as listed on aur.archlinux.org.
                  echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > ~/.ssh/known_hosts
                  export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
                  git clone ssh://aur@aur.archlinux.org/cryptex-agent-bin.git aur
                  cp "${RUNNER_TEMP}/pkg/PKGBUILD" "${RUNNER_TEMP}/pkg/.SRCINFO" aur/
                  cd aur
                  git config user.name "Cryptex Vault release bot"
                  git config user.email "noreply@cryptex-vault.com"
                  git add PKGBUILD .SRCINFO
                  git diff --cached --quiet && exit 0
                  git commit -m "Update to ${TAG#cryptex-agent-v}"
                  git push origin HEAD:master
