appId: ${CRYPTEX_APP_ID}
---
# DocumentsUI is the real Android picker. The fixture app owns these Downloads.
- runFlow:
      when:
          visible: Show roots
      commands:
          - tapOn: Show roots
          # The folder title behind the drawer also reads Downloads once the picker remembers it.
          - tapOn:
                text: Downloads
                childOf:
                    # Google and AOSP images name the picker package differently.
                    id: .*:id/roots_list
# Downloads keeps files from earlier runs, so the file can be below the fold.
- scrollUntilVisible:
      element: ${EXPORTED_FILE}
- tapOn: ${EXPORTED_FILE}
