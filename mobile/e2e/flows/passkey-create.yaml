appId: ${CRYPTEX_APP_ID}
name: Android passkey creation and persistence
---
- openLink: http://localhost:43110/passkeys
- assertVisible: Deterministic passkey fixture
- tapOn: Create account A
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- runFlow:
    when:
      visible: Save username and password to ${CRYPTEX_APP_NAME}?
    commands:
      - tapOn: No thanks
- assertVisible: Create passkey
- assertVisible: Cryptex E2E
- assertVisible: Fixture User A
- tapOn: Create and save
- assertVisible: Passkey A created

- tapOn: Create account B
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- assertVisible: Create passkey
- assertVisible: Fixture User B
- tapOn: Create and save
- assertVisible: Passkey B created
- pressKey: back

- launchApp
- runFlow:
    when:
      visible: Unlock vault
    commands:
      - tapOn: Master password
      - eraseText: 100
      - inputText: CorrectHorseBatteryStaple42
      - hideKeyboard
      - tapOn:
          id: unlock-vault
- tapOn: Search your vault
- inputText: Fixture User A
- hideKeyboard
- assertVisible: "Cryptex E2E, Passkey: Fixture User A"
- tapOn: "Cryptex E2E, Passkey: Fixture User A"
- scrollUntilVisible:
    element:
      text: Relying party
    direction: DOWN
- assertVisible: Fixture User A
- assertVisible: Relying party
- assertVisible: localhost
- tapOn: Back
- tapOn: Clear search
- tapOn: Search your vault
- inputText: Fixture User B
- hideKeyboard
- assertVisible: "Cryptex E2E, Passkey: Fixture User B"
- tapOn: "Cryptex E2E, Passkey: Fixture User B"
- scrollUntilVisible:
    element:
      text: Relying party
    direction: DOWN
- assertVisible: Fixture User B
- assertVisible: Relying party
- assertVisible: localhost
- tapOn: Back
- tapOn: Clear search
- hideKeyboard
- tapOn: Back
