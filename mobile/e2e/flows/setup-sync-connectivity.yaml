appId: ${CRYPTEX_APP_ID}
---
# The signaling and TURN servers from compose.e2e.yaml.
- tapOn: Devices
- tapOn: Link a device
- tapOn: Create invitation,.*
- tapOn: Advanced connection,.*
- scrollUntilVisible:
      element:
          text: Manage custom servers,.*
      direction: DOWN
- tapOn: Manage custom servers,.*
- tapOn: Signaling servers.*
- tapOn: Add Signaling server
- tapOn:
      id: server-Name
- runFlow:
      file: assert-focused.yaml
      env:
          FIELD: server-Name
- inputText: E2E Local Signaling
- runFlow: hide-keyboard.yaml
- tapOn:
      id: server-Host
- runFlow:
      file: assert-focused.yaml
      env:
          FIELD: server-Host
- inputText: ${SIGNALING_HOST}
- runFlow: hide-keyboard.yaml
- tapOn:
      id: server-AppID
- runFlow:
      file: assert-focused.yaml
      env:
          FIELD: server-AppID
- inputText: ${SIGNALING_APP_ID}
- runFlow: hide-keyboard.yaml
- tapOn:
      id: server-Key
- runFlow:
      file: assert-focused.yaml
      env:
          FIELD: server-Key
- inputText: ${SIGNALING_KEY}
- runFlow: hide-keyboard.yaml
- scrollUntilVisible:
      element:
          text: Secret
      direction: DOWN
- tapOn:
      id: server-Secret
- runFlow:
      file: assert-focused.yaml
      env:
          FIELD: server-Secret
- inputText: ${SIGNALING_SECRET}
- runFlow: hide-keyboard.yaml
- scrollUntilVisible:
      element:
          text: WS port
      direction: DOWN
- tapOn:
      id: server-ServicePort
- runFlow:
      file: assert-focused.yaml
      env:
          FIELD: server-ServicePort
- eraseText: 10
- inputText: ${SIGNALING_PORT}
- runFlow: hide-keyboard.yaml
- scrollUntilVisible:
      element:
          text: Save server
      direction: DOWN
- tapOn: Save server
- extendedWaitUntil:
      visible: Add Signaling server
      timeout: 15000
- assertVisible: E2E Local Signaling.*
- runFlow: go-back.yaml
- tapOn: TURN servers.*
- tapOn: Add TURN server
- tapOn:
      id: server-Name
- runFlow:
      file: assert-focused.yaml
      env:
          FIELD: server-Name
- inputText: E2E Local TURN
- runFlow: hide-keyboard.yaml
- tapOn:
      id: server-Host
- runFlow:
      file: assert-focused.yaml
      env:
          FIELD: server-Host
- inputText: ${TURN_HOST}
- runFlow: hide-keyboard.yaml
- tapOn:
      id: server-Username
- runFlow:
      file: assert-focused.yaml
      env:
          FIELD: server-Username
- inputText: ${TURN_USERNAME}
- runFlow: hide-keyboard.yaml
- scrollUntilVisible:
      element:
          text: TURN credential.*
      direction: DOWN
- tapOn:
      id: server-Credential
- runFlow:
      file: assert-focused.yaml
      env:
          FIELD: server-Credential
- inputText: ${TURN_PASSWORD}
- runFlow: hide-keyboard.yaml
- scrollUntilVisible:
      element:
          text: Save server
      direction: DOWN
- tapOn: Save server
- extendedWaitUntil:
      visible: Add TURN server
      timeout: 15000
- assertVisible: E2E Local TURN.*
- runFlow: go-back.yaml
- runFlow: go-back.yaml
- runFlow:
      when:
          visible: Invitation connection
      commands:
          - runFlow: close-sheet.yaml
- assertVisible: Receiving device name
- tapOn: Back
- assertVisible:
      id: device-link
