// Play-only policy for generated Expo projects. Every allowed artifact also needs
// a pinned checksum in play-verification-metadata.xml.
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

if (System.getenv('CRYPTEX_DISTRIBUTION') != 'play') {
    throw new GradleException('Play dependency policy requires the Play distribution')
}

def reviewedPlayDependencies = [
    'com.android.billingclient:billing:8.3.0',
    'com.revenuecat.purchases:purchases-hybrid-common:19.5.0',
    'com.revenuecat.purchases:purchases:10.24.0',
    'com.google.android.gms:play-services-base:18.5.0',
    'com.google.android.gms:play-services-basement:18.9.0',
    'com.google.android.gms:play-services-tasks:18.2.0',
    // Google Play Billing depends on location at compile scope. It declares no permission.
    'com.google.android.gms:play-services-location:19.0.0',
    'com.google.android.gms:play-services-places-placereport:17.0.0',
    'com.google.firebase:firebase-encoders:17.0.0',
    'com.google.firebase:firebase-encoders-proto:16.0.0',
    'com.google.firebase:firebase-encoders-json:18.0.0',
].toSet()

allprojects {
    configurations.configureEach {
        // RevenueCat features the app never uses: advertising ID collection,
        // Block Store backup of anonymous user IDs and the Amazon Appstore.
        exclude group: 'com.google.android.gms', module: 'play-services-ads-identifier'
        exclude group: 'com.google.android.gms', module: 'play-services-auth-blockstore'
        exclude group: 'com.revenuecat.purchases', module: 'purchases-store-amazon'
        exclude group: 'com.amazon.device'
        resolutionStrategy.eachDependency { dependency ->
            // Several React Native modules use '+' as an SDK placeholder.
            // Resolve those placeholders to the app's exact React Native version.
            if (dependency.requested.group == 'com.facebook.react' &&
                dependency.requested.name in ['react-native', 'react-android']) {
                dependency.useVersion('0.86.0')
                dependency.because('Match the pinned app React Native SDK')
            } else if (dependency.requested.group == 'org.bouncycastle' &&
                dependency.requested.name == 'bcprov-jdk15to18' &&
                dependency.requested.version == '[1.81,1.82)') {
                // expo-updates 57.0.18 pins bcutil 1.81, whose provider POM uses this range.
                dependency.useVersion('1.81')
                dependency.because('Match the pinned expo-updates Bouncy Castle utility version')
            } else {
                def version = dependency.requested.version
                if (version && (version.contains('+') || version.startsWith('latest.') ||
                    version.contains('SNAPSHOT') || version.startsWith('[') ||
                    version.startsWith('('))) {
                    throw new GradleException("Unpinned Android dependency: ${dependency.requested}")
                }
            }
        }
        incoming.afterResolve { dependencies ->
            dependencies.resolutionResult.allComponents.each { component ->
                def id = component.id
                // Expo substitutes published coordinates with source projects.
                // Reject external binaries, not those source-built projects.
                if (id instanceof ModuleComponentIdentifier) {
                    def group = id.group
                    if ((group in ['com.google.android.gms', 'com.google.firebase',
                        'com.android.billingclient', 'com.revenuecat.purchases'] &&
                        !reviewedPlayDependencies.contains("${id.group}:${id.module}:${id.version}".toString())) ||
                        group in ['com.google.mlkit', 'org.tensorflow', 'com.amazon.device'] ||
                        (group == 'host.exp.exponent' && id.module.startsWith('expo.modules.')) ||
                        group.startsWith('expo.modules.')) {
                        throw new GradleException("Disallowed prebuilt Android dependency: ${id}")
                    }
                }
            }
        }
    }
}
