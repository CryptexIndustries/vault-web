appId: ${CRYPTEX_APP_ID}
name: Credential Manager password journeys
---
# The isolated device enables Cryptex as its credential provider. This native
# journey does not depend on Chrome settings or a browser login fixture.
- runFlow: setup-vault.yaml
- runFlow: autofill-provider-password-create.yaml
- runFlow: autofill-provider-password-get.yaml
- runFlow: autofill-provider-password-cancel.yaml
