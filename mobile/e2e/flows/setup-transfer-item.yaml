appId: ${CRYPTEX_APP_ID}
---
- tapOn: Add item
- tapOn:
      id: add-item-login
- tapOn: Credential name
- inputText: E2E Transfer Login
- tapOn: Credential username
- inputText: transfer@example.test
- tapOn:
      id: credential-password
- inputText: transfer-password-42
- runFlow: hide-keyboard.yaml
- tapOn:
      id: credential-website-url
- eraseText
- inputText: https://transfer.example.test/login
- runFlow: hide-keyboard.yaml
- scrollUntilVisible:
      element:
          id: credential-submit
      direction: DOWN
- tapOn:
      id: credential-submit
- assertVisible: E2E Transfer Login.*
- tapOn: Back
